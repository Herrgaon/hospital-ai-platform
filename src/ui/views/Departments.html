<div x-show="currentView === 'departments'" x-init="$watch('currentView', v => { if (v === 'departments' && departments.length === 0) loadDepartmentsPage(); }); if (currentView === 'departments') loadDepartmentsPage();" class="max-w-5xl mx-auto">
  <div class="page-header">
    <div class="page-header-left">
      <div class="page-header-icon">▥</div>
      <div>
        <h1 class="page-title-text">KHOA / PHÒNG</h1>
        <p class="page-subtitle">Danh mục tổ chức — vừa là cơ cấu bệnh viện vừa là phạm vi phân quyền</p>
      </div>
    </div>
    <div class="page-header-actions" x-show="isSuperAdmin || isTcHc">
      <button @click="openAddDepartmentModal()" class="btn btn-primary">+ Thêm khoa/phòng</button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Tên khoa/phòng</th>
            <th>Loại</th>
            <th>Trưởng khoa/phòng</th>
            <th>Trạng thái</th>
            <th x-show="isSuperAdmin || isTcHc"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="d in departments" :key="d.DepartmentID">
            <tr>
              <td x-text="d.DepartmentName"></td>
              <td><span class="badge badge-gray" x-text="departmentTypeLabel(d.DepartmentType)"></span></td>
              <td x-show="!(isSuperAdmin || isTcHc)" x-text="d.HeadUserID ? userEmailById(d.HeadUserID) : '—'"></td>
              <td x-show="isSuperAdmin || isTcHc">
                <select x-model="d.HeadUserID" @change="updateDepartmentHeadAction(d)" class="form-control form-control-sm">
                  <option value="">-- Chưa gán --</option>
                  <template x-for="u in userDirectory" :key="u.UserID">
                    <option :value="u.UserID" x-text="u.FullName + ' (' + u.Email + ')'"></option>
                  </template>
                </select>
              </td>
              <td><span class="badge" :class="d.Status === 'Active' ? 'badge-green' : 'badge-gray'" x-text="d.Status"></span></td>
              <td x-show="isSuperAdmin || isTcHc">
                <button @click="deactivateDepartmentAction(d)" x-show="d.Status === 'Active'" class="btn-link">Ngừng hoạt động</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal: Thêm khoa/phòng -->
  <div x-show="modalOpen === 'addDepartment'" x-cloak class="modal-overlay" @click.self="closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h2>Thêm khoa/phòng mới</h2>
        <button @click="closeModal()" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="required">Tên khoa/phòng</label>
          <input type="text" x-model="newDepartmentForm.departmentName" class="form-control">
        </div>
        <div class="form-group">
          <label class="required">Loại</label>
          <select x-model="newDepartmentForm.departmentType" class="form-control">
            <option value="BAN_GIAM_DOC">Ban Giám đốc</option>
            <option value="PHONG_CHUC_NANG">Phòng chức năng</option>
            <option value="KHOA_LAM_SANG">Khoa lâm sàng</option>
            <option value="KHOA_CAN_LAM_SANG">Khoa cận lâm sàng</option>
          </select>
        </div>
        <div class="form-group">
          <label>Trưởng khoa/phòng</label>
          <select x-model="newDepartmentForm.headUserId" class="form-control">
            <option value="">-- Chưa gán --</option>
            <template x-for="u in userDirectory" :key="u.UserID">
              <option :value="u.UserID" x-text="u.FullName + ' (' + u.Email + ')'"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button @click="closeModal()" class="btn btn-secondary">Huỷ</button>
        <button @click="createDepartmentAction()" :disabled="creatingDepartment || !newDepartmentForm.departmentName" class="btn btn-primary">
          <span x-text="creatingDepartment ? 'Đang thêm...' : '+ Thêm khoa/phòng'"></span>
        </button>
      </div>
    </div>
  </div>
</div>
