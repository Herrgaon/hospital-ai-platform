<div x-show="!authToken" x-cloak class="flex items-center justify-center h-screen p-4">
  <div class="modal w-full p-6 space-y-4" style="max-width: 380px;">
    <p class="holo-label">Đăng nhập</p>
    <h1 class="font-display text-lg holo-text-accent" style="text-shadow: 0 0 10px currentColor;">HỆ THỐNG QUẢN LÝ CÔNG VIỆC – BVĐK ĐÔNG SƠN</h1>

    <template x-if="loginError">
      <div class="notice notice-warning" x-text="loginError"></div>
    </template>

    <div class="form-group !mb-2">
      <label class="required">Tên đăng nhập</label>
      <input type="text" x-model="loginForm.username" @keyup.enter="loginAction()" class="form-control" autocomplete="username">
    </div>
    <div class="form-group !mb-2">
      <label class="required">Mật khẩu</label>
      <input type="password" x-model="loginForm.password" @keyup.enter="loginAction()" class="form-control" autocomplete="current-password">
    </div>
    <button @click="loginAction()" :disabled="loggingIn || !loginForm.username || !loginForm.password" class="btn btn-primary w-full">
      <span x-text="loggingIn ? 'Đang đăng nhập...' : 'Đăng nhập'"></span>
    </button>
    <p class="text-xs holo-text-dim">Chưa có tên đăng nhập/mật khẩu? Liên hệ Phòng Tổ chức – Hành chính hoặc Quản trị hệ thống.</p>
  </div>
</div>
