<div x-show="currentView === 'aichat'" x-init="$watch('currentView', v => { if (v === 'aichat' && libraries.length === 0) loadLibraries(); })" class="max-w-2xl space-y-4 flex flex-col h-full">
  <h1 class="text-xl font-semibold">AI Chat — Hỏi đáp theo tài liệu</h1>

  <div class="border rounded p-3 space-y-2 dark:border-gray-700">
    <div class="flex items-center justify-between">
      <p class="text-sm font-medium">Phạm vi tra cứu (Knowledge Scope)</p>
      <button @click="suggestChatLibraries()" class="text-xs text-blue-600 underline">Gợi ý theo câu hỏi</button>
    </div>
    <p class="text-xs text-gray-500">Chọn kho càng đúng, câu trả lời càng nhanh và chính xác hơn. Để trống = tìm trên toàn bộ kho bạn có quyền xem.</p>
    <div class="flex flex-wrap gap-3">
      <template x-for="lib in libraries" :key="lib.LibraryID">
        <label class="text-sm flex items-center gap-1">
          <input type="checkbox" :checked="chatLibraryIds.includes(lib.LibraryID)" @change="toggleChatLibrary(lib.LibraryID, $event.target.checked)">
          <span x-text="lib.LibraryName"></span>
        </label>
      </template>
    </div>
  </div>

  <div class="flex-1 overflow-auto space-y-3 border rounded p-3 dark:border-gray-700" style="min-height:300px">
    <template x-for="(msg, idx) in chatMessages" :key="idx">
      <div :class="msg.role === 'user' ? 'text-right' : 'text-left'">
        <div class="inline-block px-3 py-2 rounded text-sm max-w-md"
             :class="msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-gray-100 dark:bg-gray-800'"
             x-text="msg.text"></div>
        <template x-if="msg.sources && msg.sources.length > 0">
          <p class="text-xs text-gray-500 mt-1">Nguồn: <template x-for="s in msg.sources" :key="s.documentId"><span x-text="s.title + ' '"></span></template></p>
        </template>
      </div>
    </template>
    <template x-if="chatAsking">
      <p class="text-sm text-gray-500">Đang trả lời...</p>
    </template>
  </div>

  <div class="flex gap-2">
    <input type="text" x-model="chatInput" @keyup.enter="sendChatMessage()" placeholder="Nhập câu hỏi..." class="flex-1 border rounded px-3 py-2 text-sm dark:bg-gray-800 dark:border-gray-600">
    <button @click="sendChatMessage()" :disabled="chatAsking || !chatInput" class="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">Gửi</button>
  </div>
</div>
