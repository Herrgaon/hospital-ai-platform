<div x-show="currentView === 'aichat'" x-init="$watch('currentView', v => { if (v === 'aichat' && libraries.length === 0) loadLibraries(); })" class="max-w-3xl h-full flex flex-col">
  <div class="page-header !mb-3">
    <div class="page-header-left">
      <div class="page-header-icon">◈</div>
      <div>
        <h1 class="page-title-text">AI CHAT</h1>
        <p class="page-subtitle">Hỏi đáp dựa trên tài liệu nội bộ đã công bố</p>
      </div>
    </div>
    <div class="page-header-actions">
      <button @click="chatScopeOpen = !chatScopeOpen" class="btn btn-secondary btn-sm">
        <span x-text="chatLibraryIds.length > 0 ? ('Phạm vi: ' + chatLibraryIds.length + ' kho') : 'Phạm vi: Toàn bộ'"></span>
        <span x-text="chatScopeOpen ? '▲' : '▼'"></span>
      </button>
    </div>
  </div>

  <div class="card !mb-3" x-show="chatScopeOpen" x-cloak>
    <div class="card-body space-y-2">
      <div class="flex items-center justify-between">
        <p class="text-xs holo-text-dim">Để trống = tìm trên toàn bộ kho bạn có quyền xem. Chọn càng đúng, câu trả lời càng nhanh và chính xác hơn.</p>
        <button @click="suggestChatLibraries()" class="btn-link shrink-0">Gợi ý theo câu hỏi</button>
      </div>
      <div class="flex flex-wrap gap-3">
        <template x-for="lib in libraries" :key="lib.LibraryID">
          <label class="form-check-label">
            <input type="checkbox" :checked="chatLibraryIds.includes(lib.LibraryID)" @change="toggleChatLibrary(lib.LibraryID, $event.target.checked)">
            <span x-text="lib.LibraryName"></span>
          </label>
        </template>
      </div>
    </div>
  </div>

  <div class="chat-shell card !mb-0 flex-1 min-h-0">
    <div class="chat-scroll px-4" x-ref="chatScroll">
      <template x-if="chatMessages.length === 0">
        <div class="chat-empty">
          <div class="chat-empty-icon">◈</div>
          <p class="font-medium" style="color: var(--holo-text);">Hỏi tôi bất cứ điều gì về tài liệu nội bộ</p>
          <p class="text-xs">Ví dụ: "Quy trình xin nghỉ phép thế nào?", "Thông tư nào quy định về đấu thầu thuốc?"</p>
        </div>
      </template>

      <template x-for="(msg, idx) in chatMessages" :key="idx">
        <div class="chat-row" :class="msg.role === 'user' ? 'self' : ''">
          <div class="chat-avatar" :class="msg.role === 'user' ? 'user' : 'ai'"
               :style="msg.role === 'user' ? avatarColorStyle(currentUser) : ''"
               x-text="msg.role === 'user' ? initials(currentUser) : '◈'"></div>
          <div>
            <div class="chat-bubble" x-text="msg.text"></div>
            <template x-if="msg.sources && msg.sources.length > 0">
              <div class="chat-sources">
                <template x-for="s in msg.sources" :key="s.documentId">
                  <span class="chat-source-chip" x-text="s.title"></span>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="chatAsking">
        <div class="chat-row">
          <div class="chat-avatar ai">◈</div>
          <div class="chat-bubble"><span class="chat-typing"><span></span><span></span><span></span></span></div>
        </div>
      </template>
    </div>

    <div class="px-4 pb-4">
      <div class="chat-input-bar">
        <input type="text" x-model="chatInput" @keyup.enter="sendChatMessage()" placeholder="Nhập câu hỏi...">
        <button @click="sendChatMessage()" :disabled="chatAsking || !chatInput" class="chat-send-btn">➤</button>
      </div>
    </div>
  </div>
</div>
