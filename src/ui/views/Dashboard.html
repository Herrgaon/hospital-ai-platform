<div x-show="currentView === 'dashboard'" x-init="$watch('currentView', v => { if (v === 'dashboard') loadDashboard(); }); loadDashboard()" class="max-w-5xl">
  <div class="page-header">
    <div class="page-header-left">
      <div class="page-header-icon">⬡</div>
      <div>
        <h1 class="page-title-text">XIN CHÀO, <span x-text="(currentUser.FullName || userEmail).toUpperCase()"></span></h1>
        <p class="page-subtitle">Hệ thống tri thức &amp; văn bản — Bệnh viện Đa khoa Đông Sơn</p>
      </div>
    </div>
    <div class="page-header-actions">
      <button @click="go('documents'); openCreateDocumentModal()" class="btn btn-primary">+ Tạo văn bản mới</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card" @click="go('workflow')">
      <div class="stat-card-icon cyan">▧</div>
      <div>
        <div class="stat-card-label">Chờ bạn duyệt</div>
        <div class="stat-card-value" x-text="dashboard.pendingApprovals.length"></div>
        <div class="stat-card-detail">Văn bản đang chờ phê duyệt</div>
      </div>
    </div>

    <div class="stat-card" @click="go('knowledge'); knowledgeTab = 'review'; loadPendingKnowledgeReviews()">
      <div class="stat-card-icon orange">▥</div>
      <div>
        <div class="stat-card-label">Tri thức chờ duyệt</div>
        <div class="stat-card-value" x-text="pendingKnowledgeReviews.length"></div>
        <div class="stat-card-detail">Tài liệu chờ công bố vào kho</div>
      </div>
    </div>

    <div class="stat-card" @click="go('documents')">
      <div class="stat-card-icon green">▤</div>
      <div>
        <div class="stat-card-label">Văn bản gần đây</div>
        <div class="stat-card-value" x-text="dashboard.myRecentDocuments.length"></div>
        <div class="stat-card-detail">Do bạn tạo, 10 văn bản mới nhất</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Truy cập nhanh</h3></div>
    <div class="card-body">
      <div class="quick-grid">
        <button @click="go('documents')" class="quick-card">
          <span class="quick-card-icon">▤</span>
          <span class="quick-card-label">Văn bản</span>
        </button>
        <button @click="go('knowledge')" class="quick-card">
          <span class="quick-card-icon">▥</span>
          <span class="quick-card-label">Kho tri thức</span>
        </button>
        <button @click="go('aichat')" class="quick-card">
          <span class="quick-card-icon">◈</span>
          <span class="quick-card-label">AI Chat</span>
        </button>
        <button @click="go('workflow')" class="quick-card">
          <span class="quick-card-icon">▧</span>
          <span class="quick-card-label">Workflow</span>
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Hoạt động gần đây</h3></div>
    <div class="card-body !p-0">
      <template x-if="dashboard.myRecentDocuments.length === 0">
        <p class="text-sm holo-text-dim p-5">Chưa có văn bản nào. Vào mục "Văn bản" để soạn văn bản đầu tiên.</p>
      </template>
      <div class="table-wrap" x-show="dashboard.myRecentDocuments.length > 0">
        <table class="data-table">
          <tbody>
            <template x-for="doc in dashboard.myRecentDocuments" :key="doc.DocumentID">
              <tr>
                <td x-text="doc.Title"></td>
                <td class="text-right"><span class="badge badge-cyan" x-text="doc.Status"></span></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
