<div x-show="currentView === 'dashboard'" x-init="$watch('currentView', v => { if (v === 'dashboard') loadDashboard(); }); loadDashboard()" class="max-w-3xl space-y-8">
  <h1 class="text-xl font-semibold">Xin chào, <span x-text="userEmail"></span></h1>

  <div class="grid grid-cols-2 gap-4">
    <button @click="go('workflow')" class="border rounded p-4 text-left hover:bg-gray-50 dark:hover:bg-gray-800 dark:border-gray-700">
      <p class="text-2xl font-semibold" x-text="dashboard.pendingApprovals.length"></p>
      <p class="text-sm text-gray-500">Văn bản đang chờ bạn duyệt</p>
    </button>
    <button @click="go('documents')" class="border rounded p-4 text-left hover:bg-gray-50 dark:hover:bg-gray-800 dark:border-gray-700">
      <p class="text-2xl font-semibold" x-text="dashboard.myRecentDocuments.length"></p>
      <p class="text-sm text-gray-500">Văn bản gần đây của bạn</p>
    </button>
  </div>

  <div class="space-y-2">
    <h2 class="text-sm font-medium">Văn bản gần đây</h2>
    <template x-if="dashboard.myRecentDocuments.length === 0">
      <p class="text-sm text-gray-500">Chưa có văn bản nào. Vào mục "Văn bản" để soạn văn bản đầu tiên.</p>
    </template>
    <ul class="space-y-1">
      <template x-for="doc in dashboard.myRecentDocuments" :key="doc.DocumentID">
        <li class="text-sm flex items-center justify-between border rounded px-3 py-2 dark:border-gray-700">
          <span x-text="doc.Title"></span>
          <span class="text-xs text-gray-500" x-text="doc.Status"></span>
        </li>
      </template>
    </ul>
  </div>
</div>
