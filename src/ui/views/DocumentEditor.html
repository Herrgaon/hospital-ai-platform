<div x-show="currentView === 'documents'" x-init="$watch('currentView', v => { if (v === 'documents') { loadMyDocuments(); if (libraries.length === 0) loadLibraries(); } })" class="max-w-3xl">
  <div class="page-header">
    <div class="page-header-left">
      <div class="page-header-icon">▤</div>
      <div>
        <h1 class="page-title-text">VĂN BẢN</h1>
        <p class="page-subtitle">Soạn văn bản từ mẫu, kiểm tra thể thức, gửi duyệt</p>
      </div>
    </div>
    <div class="page-header-actions" x-show="canAnywhere('CanCreate')">
      <button @click="openCreateDocumentModal()" class="btn btn-primary">+ Tạo văn bản mới</button>
    </div>
  </div>

  <div class="tabs">
    <button @click="docTab = 'create'" class="tab" :class="docTab === 'create' ? 'active' : ''">Đang xử lý</button>
    <button @click="docTab = 'mine'" class="tab" :class="docTab === 'mine' ? 'active' : ''">Văn bản của tôi</button>
  </div>

  <!-- Tab: Của tôi -->
  <div x-show="docTab === 'mine'">
    <div class="card">
      <div class="toolbar">
        <div class="filter-group">
          <select x-model="myDocumentsStatusFilter" class="filter-select">
            <option value="">Trạng thái: Tất cả</option>
            <option value="DRAFT">Bản nháp</option>
            <option value="PENDING_APPROVAL">Chờ duyệt</option>
            <option value="NEEDS_EDIT">Cần chỉnh sửa</option>
            <option value="PUBLISHED">Đã công bố</option>
          </select>
          <span x-show="myDocumentsStatusFilter" class="filter-active-badge">
            Đang lọc <button @click="myDocumentsStatusFilter = ''">×</button>
          </span>
        </div>
        <div class="toolbar-spacer"></div>
        <span class="text-xs holo-text-dim whitespace-nowrap" x-text="myDocumentsFiltered.length + ' văn bản'"></span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <tbody>
            <template x-for="doc in myDocumentsFiltered" :key="doc.DocumentID">
              <tr>
                <td x-text="doc.Title"></td>
                <td class="text-right whitespace-nowrap">
                  <span class="badge badge-cyan" x-text="doc.Status"></span>
                  <button @click="resumeDocument(doc)" class="btn-link">Mở</button>
                  <button x-show="can(doc.LibraryID, 'CanDelete')" @click="deleteDocumentAction(doc)" class="btn-link danger">Xoá</button>
                </td>
              </tr>
            </template>
            <template x-if="myDocumentsFiltered.length === 0">
              <tr><td class="text-xs holo-text-dim py-4">Chưa có văn bản nào phù hợp bộ lọc.</td></tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Tab: Đang xử lý -->
  <div x-show="docTab === 'create'">
    <template x-if="!currentDocument">
      <div class="card">
        <div class="card-body text-center py-10">
          <p class="text-sm holo-text-dim mb-3">Chưa có văn bản nào đang xử lý.</p>
          <button x-show="canAnywhere('CanCreate')" @click="openCreateDocumentModal()" class="btn btn-primary">+ Tạo văn bản mới</button>
          <p x-show="!canAnywhere('CanCreate')" class="text-xs holo-text-dim">Bạn chưa được cấp quyền tạo văn bản ở kho tài liệu nào — liên hệ người phụ trách kho để được cấp quyền.</p>
        </div>
      </div>
    </template>

    <!-- Kiểm tra thể thức -->
    <template x-if="currentDocument">
      <div class="space-y-4">
        <div class="card">
          <div class="card-header">
            <div>
              <h3 x-text="currentDocument.Title"></h3>
              <p class="text-xs holo-text-dim mt-0.5" x-text="currentDocument.Status"></p>
            </div>
            <button @click="closeCurrentDocument()" class="btn-link">Đóng</button>
          </div>
          <div class="card-body space-y-3">
            <a :href="'https://docs.google.com/document/d/' + currentDocument.DriveFileID + '/edit'" target="_blank" class="holo-text-accent underline text-sm inline-block">
              Mở để chỉnh sửa nội dung (Google Docs)
            </a>
            <div>
              <button @click="checkRules()" :disabled="checking" class="btn btn-secondary">
                <span x-text="checking ? 'Đang kiểm tra...' : 'Kiểm tra thể thức'"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Rà soát căn cứ pháp lý -->
        <div class="card">
          <div class="card-header">
            <h3>Rà soát căn cứ pháp lý (AI)</h3>
            <button @click="suggestReviewLibraries()" class="btn-link">Gợi ý kho phù hợp</button>
          </div>
          <div class="card-body space-y-3">
            <p class="text-xs holo-text-dim">Chọn kho tài liệu chứa văn bản pháp lý liên quan để đối chiếu — chỉ chọn kho phù hợp (ví dụ "Đấu thầu") sẽ cho kết quả nhanh và chính xác hơn quét toàn bộ hệ thống.</p>
            <div class="flex flex-wrap gap-3">
              <template x-for="lib in libraries" :key="lib.LibraryID">
                <label class="form-check-label">
                  <input type="checkbox" :checked="reviewLibraryIds.includes(lib.LibraryID)" @change="toggleReviewLibrary(lib.LibraryID, $event.target.checked)">
                  <span x-text="lib.LibraryName"></span>
                </label>
              </template>
            </div>
            <button @click="runLegalReview()" :disabled="reviewing || reviewLibraryIds.length === 0" class="btn btn-secondary">
              <span x-text="reviewing ? 'Đang rà soát...' : 'Chạy rà soát'"></span>
            </button>
            <div class="border rounded p-3 text-sm whitespace-pre-wrap" style="border-color: var(--holo-border); background: var(--holo-panel-alt);" x-show="reviewResult" x-text="reviewResult"></div>
          </div>
        </div>

        <!-- Kết quả kiểm tra thể thức -->
        <div class="card" x-show="ruleCheckResult">
          <div class="card-header">
            <h3>Kết quả kiểm tra thể thức</h3>
            <span class="badge" :class="ruleCheckResult && ruleCheckResult.passed ? 'badge-green' : 'badge-red'" x-text="ruleCheckResult && ruleCheckResult.passed ? 'Đạt thể thức' : 'Còn lỗi cần sửa'"></span>
          </div>
          <div class="card-body space-y-3">
            <template x-for="rs in (ruleCheckResult ? ruleCheckResult.ruleSets : [])" :key="rs.ruleSetId">
              <div class="border rounded p-3" style="border-color: var(--holo-border);">
                <p class="text-sm font-medium mb-2" x-text="rs.ruleSetName"></p>
                <ul class="space-y-1">
                  <template x-for="r in rs.results" :key="r.ruleId">
                    <li class="text-sm flex gap-2">
                      <span x-text="r.passed ? '✅' : (r.severity === 'ERROR' ? '❌' : '⚠️')"></span>
                      <span x-text="r.description"></span>
                    </li>
                  </template>
                </ul>
              </div>
            </template>

            <div x-show="ruleCheckResult && ruleCheckResult.passed && !submittedForApproval" class="flex gap-2">
              <button @click="exportWord()" :disabled="exporting" class="btn btn-success">
                <span x-text="exporting ? 'Đang xuất...' : 'Xuất Word trực tiếp'"></span>
              </button>
              <button @click="submitForApprovalAction()" :disabled="submittingApproval" class="btn btn-primary">
                <span x-text="submittingApproval ? 'Đang gửi...' : 'Gửi duyệt'"></span>
              </button>
            </div>

            <p class="text-sm" x-show="exportResult">
              <a :href="exportResult && exportResult.url" target="_blank" class="holo-text-accent underline">Mở file Word đã xuất</a>
            </p>
            <p class="text-sm holo-text-accent" x-show="submittedForApproval">Đã gửi duyệt — xem trạng thái tại mục "Workflow".</p>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Modal: Tạo văn bản mới -->
  <div x-show="modalOpen === 'createDocument'" x-cloak class="modal-overlay" @click.self="closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h2>Tạo văn bản mới</h2>
        <button @click="closeModal()" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="required">Mẫu văn bản</label>
          <select x-model="selectedTemplateId" @change="onTemplateChange()" class="form-control">
            <option value="">-- Chọn mẫu --</option>
            <template x-for="t in creatableTemplates" :key="t.TemplateID">
              <option :value="t.TemplateID" x-text="t.TemplateName"></option>
            </template>
          </select>
        </div>

        <template x-if="selectedTemplateFields.length > 0">
          <div class="space-y-3 border-t pt-3" style="border-color: var(--holo-border);">
            <template x-for="f in selectedTemplateFields" :key="f.name">
              <div class="form-group">
                <label x-text="f.label"></label>
                <textarea x-show="f.multiline" x-model="fieldValues[f.name]" class="form-control" rows="3"></textarea>
                <input x-show="!f.multiline" type="text" x-model="fieldValues[f.name]" class="form-control">
              </div>
            </template>
          </div>
        </template>
      </div>
      <div class="modal-footer">
        <button @click="closeModal()" class="btn btn-secondary">Huỷ</button>
        <button @click="createDocument()" :disabled="creating || selectedTemplateFields.length === 0" class="btn btn-primary">
          <span x-text="creating ? 'Đang tạo...' : 'Tạo văn bản'"></span>
        </button>
      </div>
    </div>
  </div>
</div>
