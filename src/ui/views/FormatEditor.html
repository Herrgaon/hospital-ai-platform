<div x-show="currentView === 'formatting'" class="max-w-3xl mx-auto">
  <div class="page-header">
    <div class="page-header-left">
      <div class="page-header-icon">✎</div>
      <div>
        <h1 class="page-title-text">CHỈNH SỬA ĐỊNH DẠNG</h1>
        <p class="page-subtitle">Tải văn bản có sẵn lên, chuẩn hoá định dạng, tải file đã xử lý về máy — không cần mở Word</p>
      </div>
    </div>
  </div>

  <!-- Bước 1: chưa có file nào đang xử lý -->
  <template x-if="!stagedFile">
    <div class="card">
      <div class="tabs !mb-0 px-4 pt-3">
        <button @click="formatInputMode = 'upload'" class="tab" :class="formatInputMode === 'upload' ? 'active' : ''">Tải file lên</button>
        <button @click="formatInputMode = 'paste'" class="tab" :class="formatInputMode === 'paste' ? 'active' : ''">Dán văn bản</button>
      </div>

      <div x-show="formatInputMode === 'upload'" class="card-body text-center py-10 space-y-3">
        <p class="text-sm holo-text-dim">Chọn 1 file: Google Docs, Word (.docx/.doc), PDF, ảnh scan, hoặc văn bản thuần (.txt).</p>
        <p class="text-xs holo-text-dim">PDF/ảnh scan sẽ được nhận dạng ký tự (OCR) — kiểm tra lại nội dung sau khi tải lên vì có thể có sai sót.</p>
        <label class="btn btn-primary cursor-pointer inline-block">
          <span x-text="stagingFile ? 'Đang tải lên...' : '+ Tải văn bản lên'"></span>
          <input type="file" class="hidden" :disabled="stagingFile" @change="onFormatFileSelected($event)">
        </label>
      </div>

      <div x-show="formatInputMode === 'paste'" class="card-body space-y-3">
        <div class="form-group">
          <label>Tiêu đề (không bắt buộc)</label>
          <input type="text" x-model="pasteFormatTitle" placeholder="Văn bản dán trực tiếp" class="form-control">
        </div>
        <div class="form-group">
          <label>Nội dung văn bản</label>
          <textarea x-model="pasteFormatText" rows="10" class="form-control" placeholder="Dán nội dung văn bản vào đây..."></textarea>
        </div>
        <button @click="stagePastedFormatTextAction()" :disabled="stagingFile || !pasteFormatText.trim()" class="btn btn-primary">
          <span x-text="stagingFile ? 'Đang xử lý...' : 'Bắt đầu chỉnh định dạng'"></span>
        </button>
      </div>
    </div>
  </template>

  <!-- Bước 2: đang xử lý 1 file -->
  <template x-if="stagedFile">
    <div class="space-y-4">
      <div class="card">
        <div class="card-header">
          <div>
            <h3 x-text="stagedFile.fileName"></h3>
            <p class="text-xs holo-text-dim mt-0.5">Đang chỉnh định dạng — chưa lưu vào kho tài liệu nào</p>
          </div>
          <button @click="discardFormatFileAction()" class="btn-link danger">Huỷ, bỏ file này</button>
        </div>
        <div class="card-body space-y-3">
          <div class="notice notice-warning" x-show="stagedFile.ocrUsed">
            <span class="notice-icon">⚠</span>
            <span>Đã nhận dạng ký tự (OCR) từ file PDF/ảnh — kiểm tra lại nội dung trước khi dùng, có thể có sai sót ở vài chỗ.</span>
          </div>
          <a :href="'https://docs.google.com/document/d/' + stagedFile.driveFileId + '/edit'" target="_blank" class="holo-text-accent underline text-sm inline-block">
            Mở để xem/chỉnh nội dung (Google Docs)
          </a>
          <div class="flex gap-2">
            <button @click="downloadFormattedFileAction('word')" :disabled="downloadingFormattedFile" class="btn btn-success">
              <span x-text="downloadingFormattedFile === 'word' ? 'Đang xuất...' : 'Tải xuống Word (.docx)'"></span>
            </button>
            <button @click="downloadFormattedFileAction('pdf')" :disabled="downloadingFormattedFile" class="btn btn-secondary">
              <span x-text="downloadingFormattedFile === 'pdf' ? 'Đang xuất...' : 'Tải xuống PDF'"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Định dạng — dùng chung state/API driveFileId-based -->
      <div class="card">
        <div class="card-header"><h3>Định dạng văn bản</h3></div>
        <div class="card-body space-y-4">

          <div>
            <button @click="applyFormatFileNd30Action()" :disabled="applyingNd30Style" class="btn btn-secondary">
              <span x-text="applyingNd30Style ? 'Đang áp dụng...' : 'Định dạng công văn (Nghị định 30)'"></span>
            </button>
          </div>

          <div class="form-group">
            <label>Lệnh định dạng bằng AI <span class="badge badge-gray" x-show="!aiEnabled">Cần bật AI (Admin)</span></label>
            <div class="flex gap-2">
              <input type="text" x-model="aiFormatCommand" class="form-control"
                     placeholder="Ví dụ: In hoa toàn bộ văn bản, Căn giữa, Định dạng theo Nghị định 30...">
              <button @click="runFormatFileAiCommand()" :disabled="runningAiFormatCommand || !aiFormatCommand.trim()" class="btn btn-secondary">
                <span x-text="runningAiFormatCommand ? 'Đang xử lý...' : 'Thực hiện'"></span>
              </button>
            </div>
            <p class="text-xs holo-text-dim mt-1" x-show="aiFormatCommandResultText" x-text="aiFormatCommandResultText"></p>
          </div>

          <div class="space-y-3 border-t pt-3" style="border-color: var(--holo-border);">
            <div class="grid grid-cols-2 gap-3">
              <div class="form-group">
                <label>Phông chữ</label>
                <select x-model="formatForm.fontFamily" class="form-control">
                  <option :value="null">-- Không đổi --</option>
                  <template x-for="f in allowedFontFamilies" :key="f"><option :value="f" x-text="f"></option></template>
                </select>
              </div>
              <div class="form-group">
                <label>Cỡ chữ</label>
                <input type="number" min="8" max="32" x-model.number="formatForm.fontSize" class="form-control">
              </div>
            </div>

            <div class="flex flex-wrap gap-3">
              <label class="form-check-label"><input type="checkbox" x-model="formatForm.bold"><span>Đậm</span></label>
              <label class="form-check-label"><input type="checkbox" x-model="formatForm.italic"><span>Nghiêng</span></label>
              <label class="form-check-label"><input type="checkbox" x-model="formatForm.underline"><span>Gạch chân</span></label>
              <label class="form-check-label"><input type="checkbox" x-model="formatForm.strikethrough"><span>Gạch ngang</span></label>
            </div>

            <div class="grid grid-cols-3 gap-3">
              <div class="form-group">
                <label>Kiểu chữ hoa/thường</label>
                <select x-model="formatForm.textCase" class="form-control">
                  <option :value="null">-- Không đổi --</option>
                  <option value="UPPERCASE">CHỮ HOA</option>
                  <option value="LOWERCASE">chữ thường</option>
                  <option value="SENTENCE_CASE">Câu đầu tiên viết hoa</option>
                  <option value="TITLE_CASE">Viết Hoa Đầu Từ</option>
                </select>
              </div>
              <div class="form-group">
                <label>Màu chữ</label>
                <input type="color" x-model="formatForm.textColor" class="form-control">
              </div>
              <div class="form-group">
                <label>Màu tô sáng</label>
                <input type="color" x-model="formatForm.backgroundColor" class="form-control">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div class="form-group">
                <label>Căn lề đoạn văn</label>
                <select x-model="formatForm.alignment" class="form-control">
                  <option :value="null">-- Không đổi --</option>
                  <option value="LEFT">Trái</option>
                  <option value="CENTER">Giữa</option>
                  <option value="RIGHT">Phải</option>
                  <option value="JUSTIFY">Đều 2 bên</option>
                </select>
              </div>
              <div class="form-group">
                <label>Giãn dòng</label>
                <select x-model.number="formatForm.lineSpacing" class="form-control">
                  <option :value="null">-- Không đổi --</option>
                  <option value="1">1.0</option>
                  <option value="1.15">1.15</option>
                  <option value="1.5">1.5</option>
                  <option value="2">2.0</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
              <div class="form-group">
                <label>Cách đoạn trước (pt)</label>
                <input type="number" min="0" max="72" x-model.number="formatForm.spacingBeforePt" class="form-control">
              </div>
              <div class="form-group">
                <label>Cách đoạn sau (pt)</label>
                <input type="number" min="0" max="72" x-model.number="formatForm.spacingAfterPt" class="form-control">
              </div>
              <div class="form-group">
                <label>Thụt lề dòng đầu (mm)</label>
                <input type="number" min="0" max="50" x-model.number="formatForm.firstLineIndentMm" class="form-control">
              </div>
            </div>

            <div class="grid grid-cols-4 gap-3">
              <div class="form-group">
                <label>Lề trên (mm)</label>
                <input type="number" min="5" max="100" x-model.number="formatForm.topMm" class="form-control">
              </div>
              <div class="form-group">
                <label>Lề dưới (mm)</label>
                <input type="number" min="5" max="100" x-model.number="formatForm.bottomMm" class="form-control">
              </div>
              <div class="form-group">
                <label>Lề trái (mm)</label>
                <input type="number" min="5" max="100" x-model.number="formatForm.leftMm" class="form-control">
              </div>
              <div class="form-group">
                <label>Lề phải (mm)</label>
                <input type="number" min="5" max="100" x-model.number="formatForm.rightMm" class="form-control">
              </div>
            </div>

            <button @click="applyFormatFileManualAction()" :disabled="applyingFormat || !hasAnyFormatFieldSet" class="btn btn-primary">
              <span x-text="applyingFormat ? 'Đang áp dụng...' : 'Áp dụng định dạng'"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
