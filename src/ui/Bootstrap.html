<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <?!= include('ui/css/main') ?>
</head>
<body>
  <div x-data="bootstrapScreen()" class="flex items-center justify-center h-screen p-4">
    <div class="modal w-full p-6 space-y-4">
      <p class="holo-label">System Bootstrap</p>
      <h1 class="font-display text-lg holo-text-accent" style="text-shadow: 0 0 10px currentColor;">HỆ THỐNG QUẢN LÝ CÔNG VIỆC – BVĐK ĐÔNG SƠN</h1>
      <p class="text-sm holo-text-dim">
        Chưa phát hiện dữ liệu hệ thống. Bấm nút bên dưới để tự động tạo Spreadsheet, thư mục Drive,
        vai trò, quyền và danh mục khoa/phòng mặc định.
        Người bấm nút này sẽ trở thành Quản trị hệ thống đầu tiên.
      </p>

      <template x-if="errorMessage">
        <div class="notice notice-warning" x-text="errorMessage"></div>
      </template>

      <template x-if="!done">
        <button @click="run()" :disabled="running" class="btn btn-primary w-full">
          <span x-text="running ? 'ĐANG KHỞI TẠO...' : '▶ INITIALIZE SYSTEM'"></span>
        </button>
      </template>

      <template x-if="done && !credentialsSet">
        <div class="space-y-3">
          <p class="text-sm holo-text-accent">✓ Khởi tạo thành công. Đặt tên đăng nhập và mật khẩu quản trị.</p>
          <div class="form-group !mb-2">
            <label class="required">Tên đăng nhập</label>
            <input type="text" x-model="username" class="form-control" placeholder="VD: admin">
          </div>
          <div class="form-group !mb-2">
            <label class="required">Mật khẩu (tối thiểu 8 ký tự)</label>
            <input type="password" x-model="password" class="form-control">
          </div>
          <button @click="setupCredentials()" :disabled="settingUp || !username || password.length < 8" class="btn btn-primary w-full">
            <span x-text="settingUp ? 'ĐANG LƯU...' : 'LƯU VÀ ĐĂNG NHẬP'"></span>
          </button>
        </div>
      </template>

      <template x-if="credentialsSet">
        <div class="space-y-2">
          <p class="text-sm holo-text-accent">✓ Đã sẵn sàng. Đang chuyển vào màn hình đăng nhập...</p>
        </div>
      </template>
    </div>
  </div>

  <?!= include('ui/js/bootstrapJs') ?>
</body>
</html>
