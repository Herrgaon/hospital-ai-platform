<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
  function bootstrapScreen() {
    return {
      running: false,
      done: false,
      settingUp: false,
      credentialsSet: false,
      username: '',
      password: '',
      errorMessage: '',
      run() {
        this.running = true;
        this.errorMessage = '';
        google.script.run
          .withSuccessHandler(() => {
            this.running = false;
            this.done = true;
          })
          .withFailureHandler((e) => {
            this.running = false;
            this.errorMessage = e.message;
          })
          .initializeSystem();
      },
      setupCredentials() {
        this.settingUp = true;
        this.errorMessage = '';
        google.script.run
          .withSuccessHandler(() => {
            this.settingUp = false;
            this.credentialsSet = true;
            setTimeout(() => { window.location.reload(); }, 1200);
          })
          .withFailureHandler((e) => {
            this.settingUp = false;
            this.errorMessage = e.message;
          })
          .setupFirstAdminCredentials(this.username, this.password);
      }
    };
  }
</script>
