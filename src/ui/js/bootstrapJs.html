<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
  function bootstrapScreen() {
    return {
      running: false,
      done: false,
      errorMessage: '',
      run() {
        this.running = true;
        this.errorMessage = '';
        google.script.run
          .withSuccessHandler(() => {
            this.running = false;
            this.done = true;
            window.location.reload();
          })
          .withFailureHandler((e) => {
            this.running = false;
            this.errorMessage = e.message;
          })
          .initializeSystem();
      }
    };
  }
</script>
