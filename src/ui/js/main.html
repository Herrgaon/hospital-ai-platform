<!-- Alpine.js qua CDN — ghim phiên bản cụ thể (không dùng range @3.x.x thả nổi) + SRI. Nâng phiên bản:
     đổi cả version trong URL lẫn hash integrity cùng lúc. -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
        integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
        crossorigin="anonymous"></script>
<script>
  function appShell() {
    return {
      // --- Đăng nhập (mã nhân viên + mật khẩu qua Gateway — KHÔNG còn dựa vào phiên Google, xem
      // Auth.Session.gs). Token lưu ở sessionStorage (KHÔNG dùng localStorage) — CỐ Ý theo yêu cầu Product
      // Owner: đóng trình duyệt/tab (sau này đóng Desktop App) phải tự động đăng xuất, không giữ đăng
      // nhập qua lần mở lại. Vẫn giữ được đăng nhập qua các lần TẢI LẠI trang trong cùng phiên trình
      // duyệt vì sessionStorage sống hết vòng đời tab, chỉ mất khi tab/trình duyệt đóng hẳn. Mỗi lệnh
      // gọi google.script.run...api_xxx() đều truyền this.authToken làm tham số đầu tiên. ---
      authToken: '',
      loginForm: { username: '', password: '' },
      loggingIn: false,
      loginError: '',
      showLoginPassword: false,

      userEmail: '',
      currentUser: {},
      myEmployeeId: '',
      get isSuperAdmin() { return this.currentUser.Role === 'SUPER_ADMIN'; },
      get isTcHc() { return this.currentUser.Role === 'PHONG_TC_HC'; },
      get isKhNv() { return this.currentUser.Role === 'PHONG_KH_NV'; },
      get isBanGiamDoc() { return this.currentUser.Role === 'BAN_GIAM_DOC'; },
      myPermissionMap: {},
      can(departmentId, action) {
        if (this.isSuperAdmin) return true;
        return !!(this.myPermissionMap[departmentId] && this.myPermissionMap[departmentId][action]);
      },
      canAnywhere(action) {
        if (this.isSuperAdmin) return true;
        return Object.values(this.myPermissionMap).some((p) => p[action]);
      },
      showProfileMenu: false,
      profileForm: { fullName: '' },
      savingProfile: false,
      pendingAvatarFile: null,
      uploadingAvatar: false,
      aiEnabled: false,
      errorMessage: '',

      // Sidebar: nhóm điều hướng thu gọn/mở rộng — nhớ lựa chọn qua localStorage (sở thích giao diện
      // thuần tuý, không phải dữ liệu phiên đăng nhập, khác hẳn lý do dùng sessionStorage cho token).
      // Mặc định TẤT CẢ mở rộng (giữ nguyên trải nghiệm cũ) — người dùng tự thu gọn nhóm nào muốn ẩn.
      collapsedNavGroups: {},
      loadCollapsedNavGroups_() {
        try { this.collapsedNavGroups = JSON.parse(localStorage.getItem('bvds_collapsed_nav_groups') || '{}'); }
        catch (e) { this.collapsedNavGroups = {}; }
      },
      isNavGroupCollapsed(key) { return !!this.collapsedNavGroups[key]; },
      toggleNavGroup(key) {
        this.collapsedNavGroups[key] = !this.collapsedNavGroups[key];
        localStorage.setItem('bvds_collapsed_nav_groups', JSON.stringify(this.collapsedNavGroups));
      },

      departments: [],
      employees: [],
      userDirectory: [],

      init() {
        // errorMessage được gán ở rất nhiều chỗ (withFailureHandler) nhưng theo dõi tập trung ở đây để
        // MỌI lỗi tự động hiện thành toast, không cần sửa lại từng chỗ gọi.
        this.$watch('errorMessage', (value) => { if (value) this.toast('error', value); });

        this.currentView = (location.hash || '#dashboard').replace('#', '');
        this.loadCollapsedNavGroups_();
        if (!document.documentElement.classList.contains('theme-loaded')) {
          document.documentElement.classList.add('theme-loaded');
          if (localStorage.getItem('theme') === 'dark' ||
              (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        }

        google.script.run
          .withSuccessHandler((enabled) => { this.aiEnabled = enabled; })
          .withFailureHandler(() => {})
          .api_isAiEnabled();

        // Dọn token cũ còn sót lại từ bản trước khi đổi sang sessionStorage — KHÔNG dùng để tự đăng
        // nhập lại (đúng yêu cầu tự đăng xuất khi đóng trình duyệt), chỉ xoá cho sạch.
        if (localStorage.getItem('bvds_auth_token')) localStorage.removeItem('bvds_auth_token');

        const savedToken = sessionStorage.getItem('bvds_auth_token');
        if (savedToken) {
          this.authToken = savedToken;
          this.loadCurrentUserAndAppData_();
        }
      },

      // Gọi lại sau login thành công VÀ khi khôi phục token đã lưu từ sessionStorage lúc mở trang.
      // Trước đây đây là 1 lệnh api_getCurrentUser rồi mới gọi loadAppData_ (bắn tiếp ~9 lệnh
      // google.script.run gần như đồng thời) — mỗi lệnh tự verify token + mở spreadsheet riêng, cộng
      // dồn thành độ trễ rõ rệt lúc chuyển từ màn đăng nhập sang giao diện làm việc. Gộp toàn bộ vào
      // api_getInitialAppData (Core.Api.gs) — ĐÚNG 1 round-trip duy nhất.
      loadCurrentUserAndAppData_() {
        google.script.run
          .withSuccessHandler((data) => { this.applyInitialAppData_(data); })
          .withFailureHandler(() => {
            // Token hết hạn/không hợp lệ — quay lại màn hình đăng nhập, không hiện lỗi ồn ào.
            this.authToken = '';
            sessionStorage.removeItem('bvds_auth_token');
          })
          .api_getInitialAppData(this.authToken);
      },
      applyInitialAppData_(data) {
        this.userEmail = data.user.Email;
        this.currentUser = data.user;
        this.profileForm.fullName = data.user.FullName;
        this.myEmployeeId = data.myEmployee ? data.myEmployee.EmployeeID : '';
        this.myPermissionMap = data.myPermissionMap;
        this.departments = data.departments;
        this.employees = data.employees;
        this.userDirectory = data.userDirectory;
        this.myActiveDutyLeaderShift = data.myActiveDutyLeaderShift;
        this.myOfficialDutyShifts = data.myOfficialDutyShifts;
        this.mySwapRequests = data.mySwapRequests;
        this.pendingSwapConfirmations = data.pendingSwapConfirmations;
        this.dashboard = data.dashboard;
      },
      // Dùng khi cần tải lại TOÀN BỘ dữ liệu ban đầu ngoài lúc đăng nhập (hiếm khi cần — hầu hết màn
      // hình tự tải lại đúng phần dữ liệu của mình qua các api_list*/api_get* riêng lẻ khi cần).
      loadAppData_() {
        this.loadCurrentUserAndAppData_();
      },

      // §33 đặc tả: khi đăng nhập, nếu đang là Trưởng trực ca hiện tại thì hiển thị ngay ở Dashboard —
      // "không bắt người dùng tìm trong menu". Quyền này tự tính lại mỗi lần tải, tự hết khi hết ca
      // (xem DutySchedule.RoleGrant.gs#getMyActiveDutyLeaderShift — không có trạng thái lưu trữ). Vẫn
      // giữ hàm riêng này để làm mới ĐÚNG phần banner khi cần (VD sau khi công bố lịch trực), không
      // phải tải lại toàn bộ dữ liệu ứng dụng.
      myActiveDutyLeaderShift: null,
      loadMyActiveDutyLeaderShift() {
        google.script.run
          .withSuccessHandler((result) => { this.myActiveDutyLeaderShift = result; })
          .withFailureHandler(() => {})
          .api_getMyActiveDutyLeaderShift(this.authToken);
      },

      loginAction() {
        this.loggingIn = true;
        this.loginError = '';
        google.script.run
          .withSuccessHandler((result) => {
            this.loggingIn = false;
            this.authToken = result.token;
            sessionStorage.setItem('bvds_auth_token', result.token);
            this.loginForm = { username: '', password: '' };
            // Nạp toàn bộ dữ liệu ứng dụng qua đúng 1 round-trip (xem loadCurrentUserAndAppData_).
            this.loadCurrentUserAndAppData_();
          })
          .withFailureHandler((e) => {
            this.loggingIn = false;
            this.loginError = e.message;
          })
          .api_login(this.loginForm.username, this.loginForm.password);
      },

      logoutAction() {
        const token = this.authToken;
        this.authToken = '';
        this.currentUser = {};
        sessionStorage.removeItem('bvds_auth_token');
        this.currentView = 'dashboard';
        google.script.run.withFailureHandler(() => {}).api_logout(token);
      },

      active(view) {
        return this.currentView === view ? 'active' : '';
      },

      // Điều hướng thuần JS — KHÔNG dùng <a href="#..."> điều hướng gốc, vì <base target="_top">
      // (cần thiết cho các link tải file mở tab mới) khiến trình duyệt cố điều hướng frame trên
      // cùng ra khỏi sandbox iframe của Apps Script, gây văng ra trang trắng userCodeAppPanel.
      go(view) {
        this.currentView = view;
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', '#' + view);
        }
      },
      goToPersonnelTab(tab) {
        this.personnelTab = tab;
        if (tab === 'orgStructure') this.loadOrganizationTreeAction();
        if (tab === 'catalog' && this.positionsCatalog.length === 0) this.loadPositionAndJobTitleCatalogs();
        this.go('personnel');
      },

      toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      },

      // --- Toast & Modal (dùng chung toàn app) ---
      toasts: [],
      toastSeq: 0,
      toast(type, message) {
        const id = ++this.toastSeq;
        this.toasts.push({ id, type, message });
        setTimeout(() => { this.toasts = this.toasts.filter((t) => t.id !== id); }, 3500);
      },

      modalOpen: null,
      openModal(name) { this.modalOpen = name; },
      closeModal() { this.modalOpen = null; },

      get pendingCount() {
        return this.pendingSwapConfirmations.length;
      },

      // --- Avatar (dùng chung: bảng người dùng, danh bạ, top bar) ---
      initials(user) {
        const label = (user && (user.FullName || user.Email)) || '?';
        const parts = label.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return label.substring(0, 2).toUpperCase();
      },

      avatarColorStyle(user) {
        const key = (user && (user.UserID || user.EmployeeID || user.Email)) || '?';
        const palette = ['#0891b2', '#0e7490', '#7c3aed', '#be185d', '#b45309', '#15803d', '#1d4ed8'];
        let hash = 0;
        for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
        const color = palette[hash % palette.length];
        return 'background-color:' + color + '; color:#ffffff;';
      },

      // --- Lookup dùng chung ---
      userEmailById(userId) {
        const u = this.userDirectory.find((x) => x.UserID === userId);
        return u ? u.Email : userId;
      },

      departmentNameById(departmentId) {
        const d = this.departments.find((x) => x.DepartmentID === departmentId);
        return d ? d.DepartmentName : departmentId;
      },

      departmentTypeLabel(type) {
        const map = {
          BAN_GIAM_DOC: 'Ban Giám đốc', PHONG_CHUC_NANG: 'Phòng chức năng',
          KHOA_LAM_SANG: 'Khoa lâm sàng', KHOA_CAN_LAM_SANG: 'Khoa cận lâm sàng'
        };
        return map[type] || type;
      },

      employeeNameById(employeeId) {
        const e = this.employees.find((x) => x.EmployeeID === employeeId);
        return e ? e.FullName : employeeId;
      },

      employeesByDepartment(departmentId) {
        if (!departmentId) return [];
        return this.employees.filter((e) => e.DepartmentID === departmentId && e.Status === 'Active');
      },

      saveProfileAction() {
        this.savingProfile = true;
        google.script.run
          .withSuccessHandler(() => {
            this.savingProfile = false;
            this.currentUser.FullName = this.profileForm.fullName;
          })
          .withFailureHandler((e) => {
            this.savingProfile = false;
            this.errorMessage = e.message;
          })
          .api_updateMyProfile(this.authToken, this.profileForm.fullName);
      },

      onAvatarFileSelected(event) {
        const file = event.target.files[0];
        if (!file) { this.pendingAvatarFile = null; return; }
        const reader = new FileReader();
        reader.onload = () => {
          this.pendingAvatarFile = { mimeType: file.type || 'image/png', base64: reader.result.split(',')[1] };
          this.uploadAvatarAction();
        };
        reader.readAsDataURL(file);
      },

      uploadAvatarAction() {
        if (!this.pendingAvatarFile) return;
        this.uploadingAvatar = true;
        google.script.run
          .withSuccessHandler((updated) => {
            this.uploadingAvatar = false;
            this.pendingAvatarFile = null;
            this.currentUser.AvatarUrl = updated.AvatarUrl;
          })
          .withFailureHandler((e) => {
            this.uploadingAvatar = false;
            this.errorMessage = e.message;
          })
          .api_updateMyAvatar(this.authToken, this.pendingAvatarFile.base64, this.pendingAvatarFile.mimeType);
      },

      // --- Dashboard ---
      dashboard: { myTasks: [], myShiftsThisWeek: [], pendingSwapConfirmations: [], pendingAttendanceAdjustments: [], myKpiResultsThisPeriod: [] },
      loadDashboard() {
        google.script.run
          .withSuccessHandler((summary) => { this.dashboard = summary; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getDashboardSummary(this.authToken);
      },

      // --- Nhân sự (đặc tả Tái cấu trúc Nhân sự V1 — trung tâm là "con người + cơ cấu tổ chức +
      // chức danh/chức vụ + phân công"; Tài khoản/Vai trò/Phân quyền tách sang Quản trị) ---
      personnelTab: 'list',
      employeeFilters: { search: '', departmentId: '', position: '', jobTitle: '', status: '' },
      get employeesFiltered() {
        const q = this.employeeFilters.search.trim().toLowerCase();
        return this.employees.filter((e) => {
          if (q && !(e.FullName || '').toLowerCase().includes(q) && !(e.EmployeeCode || '').toLowerCase().includes(q)) return false;
          if (this.employeeFilters.departmentId && e.DepartmentID !== this.employeeFilters.departmentId) return false;
          if (this.employeeFilters.position && e.Position !== this.employeeFilters.position) return false;
          if (this.employeeFilters.jobTitle && e.JobTitle !== this.employeeFilters.jobTitle) return false;
          if (this.employeeFilters.status && (e.Status || 'Active') !== this.employeeFilters.status) return false;
          return true;
        });
      },
      get distinctEmployeePositions() {
        return [...new Set(this.employees.map((e) => e.Position).filter((p) => p))].sort();
      },
      get distinctEmployeeJobTitles() {
        return [...new Set(this.employees.map((e) => e.JobTitle).filter((j) => j))].sort();
      },
      // Đặc tả Tái cấu trúc Nhân sự V1 §4: thống kê PHẢI tính trên tập kết quả ĐÃ LỌC, không phải toàn
      // viện cố định — cố ý dùng employeesFiltered (không phải employees) để tránh gây hiểu nhầm khi
      // đang lọc theo khoa/phòng hoặc chức danh cụ thể.
      get employeeStats() {
        const base = this.employeesFiltered;
        return {
          total: base.length,
          active: base.filter((e) => (e.Status || 'Active') === 'Active').length,
          onLeave: base.filter((e) => e.Status === 'OnLeave').length,
          inactive: base.filter((e) => e.Status === 'Inactive').length
        };
      },
      employeeFiltersActive() {
        const f = this.employeeFilters;
        return !!(f.search || f.departmentId || f.position || f.jobTitle || f.status);
      },
      clearEmployeeFilters() {
        this.employeeFilters = { search: '', departmentId: '', position: '', jobTitle: '', status: '' };
      },
      employeeStatusLabel(status) {
        const map = { Active: 'Đang làm việc', OnLeave: 'Nghỉ phép/Thai sản', Inactive: 'Ngừng làm việc' };
        return map[status || 'Active'] || status;
      },
      employeeStatusBadgeClass(status) {
        const map = { Active: 'badge-green', OnLeave: 'badge-orange', Inactive: 'badge-gray' };
        return map[status || 'Active'] || 'badge-gray';
      },
      loadEmployeesPage() {
        google.script.run
          .withSuccessHandler((emps) => { this.employees = emps; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listEmployees(this.authToken);
      },
      newEmployeeForm: { employeeCode: '', username: '', email: '', fullName: '', departmentId: '', position: '', jobTitle: '', employeeType: '', phoneNumber: '', startDate: '', recordOwnerUserId: '' },
      creatingEmployee: false,
      openAddEmployeeModal() {
        this.newEmployeeForm = { employeeCode: '', username: '', email: '', fullName: '', departmentId: '', position: '', jobTitle: '', employeeType: '', phoneNumber: '', startDate: '', recordOwnerUserId: '' };
        this.openModal('addEmployee');
      },
      createEmployeeAction() {
        this.creatingEmployee = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingEmployee = false;
            this.closeModal();
            this.toast('success', 'Đã thêm nhân sự mới.');
            this.loadEmployeesPage();
          })
          .withFailureHandler((e) => {
            this.creatingEmployee = false;
            this.errorMessage = e.message;
          })
          .api_createEmployee(this.authToken, this.newEmployeeForm);
      },
      // Sửa nhanh 1 trường ngay trên bảng (Trạng thái/Người phụ trách hồ sơ) — dùng chung updateEmployee
      // (đã có sẵn, nhận patch tuỳ ý) thay vì tạo hàm setter riêng cho từng trường.
      saveEmployeeFieldAction(e, patch) {
        google.script.run
          .withFailureHandler((err) => { this.errorMessage = err.message; this.loadEmployeesPage(); })
          .api_updateEmployee(this.authToken, e.EmployeeID, patch);
      },
      deactivateEmployeeAction(e) {
        if (!confirm('Ngừng hoạt động nhân viên "' + e.FullName + '"? Tài khoản đăng nhập của họ cũng sẽ bị khoá.')) return;
        google.script.run
          .withSuccessHandler(() => { this.loadEmployeesPage(); })
          .withFailureHandler((err) => { this.errorMessage = err.message; })
          .api_deactivateEmployee(this.authToken, e.EmployeeID);
      },
      importEmployeesCsv: '',
      importEmployeesResults: [],
      importingEmployees: false,
      openImportEmployeesModal() {
        this.importEmployeesCsv = '';
        this.importEmployeesResults = [];
        this.openModal('importEmployees');
      },
      importEmployeesAction() {
        const rows = this.importEmployeesCsv.split('\n').map((line) => line.trim()).filter((line) => line.length > 0).map((line) => {
          const parts = line.split(',').map((p) => p.trim());
          return {
            employeeCode: parts[0], username: parts[1], email: parts[2], fullName: parts[3],
            departmentName: parts[4], position: parts[5] || '', jobTitle: parts[6] || '',
            employeeType: parts[7] || '', phoneNumber: parts[8] || '', startDate: parts[9] || ''
          };
        });
        if (rows.length === 0) return;
        this.importingEmployees = true;
        google.script.run
          .withSuccessHandler((results) => {
            this.importingEmployees = false;
            this.importEmployeesResults = results;
            this.toast('success', 'Đã xử lý ' + results.length + ' dòng.');
            this.loadEmployeesPage();
          })
          .withFailureHandler((e) => {
            this.importingEmployees = false;
            this.errorMessage = e.message;
          })
          .api_importEmployees(this.authToken, rows);
      },
      exportingEmployees: false,
      exportEmployeesAction() {
        this.exportingEmployees = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.exportingEmployees = false;
            window.open(result.url, '_blank');
          })
          .withFailureHandler((e) => {
            this.exportingEmployees = false;
            this.errorMessage = e.message;
          })
          .api_exportEmployeesToExcel(this.authToken);
      },

      resetPasswordTarget: null,
      resetPasswordForm: { newPassword: '' },
      resettingPassword: false,
      showResetPassword: false,
      openResetPasswordModal(e) {
        this.resetPasswordTarget = e;
        this.resetPasswordForm = { newPassword: '' };
        this.showResetPassword = false;
        this.openModal('resetEmployeePassword');
      },
      resetEmployeePasswordAction() {
        this.resettingPassword = true;
        google.script.run
          .withSuccessHandler(() => {
            this.resettingPassword = false;
            this.closeModal();
            this.toast('success', 'Đã đặt lại mật khẩu.');
          })
          .withFailureHandler((e) => {
            this.resettingPassword = false;
            this.errorMessage = e.message;
          })
          .api_resetEmployeePassword(this.authToken, this.resetPasswordTarget.EmployeeID, this.resetPasswordForm.newPassword);
      },

      changePasswordForm: { oldPassword: '', newPassword: '' },
      changingPassword: false,
      showChangePasswordOld: false,
      showChangePasswordNew: false,
      openChangePasswordModal() {
        this.changePasswordForm = { oldPassword: '', newPassword: '' };
        this.showChangePasswordOld = false;
        this.showChangePasswordNew = false;
        this.openModal('changePassword');
      },
      changeMyPasswordAction() {
        this.changingPassword = true;
        google.script.run
          .withSuccessHandler(() => {
            this.changingPassword = false;
            this.closeModal();
            this.toast('success', 'Đã đổi mật khẩu.');
          })
          .withFailureHandler((e) => {
            this.changingPassword = false;
            this.errorMessage = e.message;
          })
          .api_changeMyPassword(this.authToken, this.changePasswordForm.oldPassword, this.changePasswordForm.newPassword);
      },

      // --- Khoa/Phòng / Cơ cấu tổ chức ---
      loadDepartmentsPage() {
        google.script.run
          .withSuccessHandler((depts) => { this.departments = depts; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listActiveDepartments(this.authToken);
      },
      newDepartmentForm: { departmentName: '', departmentType: 'KHOA_LAM_SANG', parentDepartmentId: '', headUserId: '' },
      creatingDepartment: false,
      openAddDepartmentModal() {
        this.newDepartmentForm = { departmentName: '', departmentType: 'KHOA_LAM_SANG', parentDepartmentId: '', headUserId: '' };
        this.openModal('addDepartment');
      },
      createDepartmentAction() {
        this.creatingDepartment = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingDepartment = false;
            this.closeModal();

      get flatOrganizationTree() {
        const rows = [];
        const walk = (nodes, depth) => {
          nodes.forEach((node) => {
            const { children, ...department } = node;
            rows.push({ department, depth });
            if (children && children.length > 0) walk(children, depth + 1);
          });
        };
        walk(this.organizationTree, 0);
        return rows;

      taskTab: 'mine',

      taskSearchQuery: '',
      taskFilters: { priority: '', sourceType: '' },
      myTasks: [],
      departmentTasks: [],
      myRecurringTemplates: [],
      taskDepartmentFilter: '',
      calendarViewDate: new Date(),
      loadMyTasksAction() {
        google.script.run
          .withSuccessHandler((tasks) => { this.myTasks = tasks; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listMyTasks(this.authToken);
      },
      get myTasksBaseFiltered() {
        const q = this.taskSearchQuery.trim().toLowerCase();
        return this.myTasks.filter((t) => {
          if (q && !(t.Title || '').toLowerCase().includes(q) && !(t.Description || '').toLowerCase().includes(q)) return false;
          if (this.taskFilters.priority && t.Priority !== this.taskFilters.priority) return false;
          if (this.taskFilters.sourceType && t.SourceType !== this.taskFilters.sourceType) return false;
          return true;
        });
      },
      get myTasksFiltered() {
        const todayStr = this.todayDateStr_();
        const weekEndStr = this.addDaysToDateStr_(todayStr, 7);
        return this.myTasksBaseFiltered.filter((t) => {
          switch (this.taskStatusTab) {
            case 'today': return t.DueDate === todayStr;
            case 'week': return t.DueDate && t.DueDate >= todayStr && t.DueDate <= weekEndStr;
            case 'inProgress': return t.Status === 'ASSIGNED' || t.Status === 'IN_PROGRESS';
            case 'pendingConfirm': return t.Status === 'SUBMITTED';
            case 'done': return t.Status === 'EVALUATED';
            case 'overdue': return !!t.IsOverdue;
            default: return true;
          }
        });
      },
      get taskStats() {
        const todayStr = this.todayDateStr_();
        const base = this.myTasksBaseFiltered;
        return {
          total: base.length,
          today: base.filter((t) => t.DueDate === todayStr).length,
          inProgress: base.filter((t) => t.Status === 'ASSIGNED' || t.Status === 'IN_PROGRESS').length,
          pendingConfirm: base.filter((t) => t.Status === 'SUBMITTED').length,
          overdue: base.filter((t) => t.IsOverdue).length
        };
      },
      get upcomingTasks() {
        const todayStr = this.todayDateStr_();
        return this.myTasksBaseFiltered
          .filter((t) => t.DueDate && t.DueDate >= todayStr && !['EVALUATED', 'CANCELLED'].includes(t.Status))
          .sort((a, b) => a.DueDate < b.DueDate ? -1 : 1)
          .slice(0, 5);
      },
      get overdueTasksList() {
        return this.myTasksBaseFiltered.filter((t) => t.IsOverdue).slice(0, 5);
      },
      todayDateStr_() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      },
      addDaysToDateStr_(dateStr, days) {
        const d = new Date(dateStr + 'T00:00:00');
        d.setDate(d.getDate() + days);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      },
      shiftCalendarMonth(delta) {
        const d = new Date(this.calendarViewDate);
        d.setMonth(d.getMonth() + delta);
        this.calendarViewDate = d;
      },
      get calendarMonthLabel() {
        return 'Tháng ' + (this.calendarViewDate.getMonth() + 1) + '/' + this.calendarViewDate.getFullYear();
      },
      get calendarLeadingBlanks() {
        const first = new Date(this.calendarViewDate.getFullYear(), this.calendarViewDate.getMonth(), 1);
        const isoWeekday = (first.getDay() + 6) % 7; // Monday = 0
        return Array.from({ length: isoWeekday }, (_, i) => i);
      },
      get calendarDaysInMonth() {
        const y = this.calendarViewDate.getFullYear();
        const m = this.calendarViewDate.getMonth();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const todayStr = this.todayDateStr_();
        const dueDates = new Set(this.myTasksBaseFiltered.filter((t) => t.DueDate).map((t) => t.DueDate));
        return Array.from({ length: daysInMonth }, (_, i) => {
          const dayNum = i + 1;
          const dateStr = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
          return { dayNum, dateStr, isToday: dateStr === todayStr, hasDueTask: dueDates.has(dateStr) };
        });
      },
      taskSourceLabel(sourceType) {
        const map = { ASSIGNED: 'Được giao', PERSONAL: 'Cá nhân', RECURRING: 'Định kỳ', SYSTEM: 'Hệ thống' };
        return map[sourceType] || sourceType || 'Được giao';
      },
      taskSourceBadgeClass(sourceType) {
        const map = { ASSIGNED: 'badge-orange', PERSONAL: 'badge-green', RECURRING: 'badge-purple', SYSTEM: 'badge-gray' };
        return map[sourceType] || 'badge-orange';
      },
      taskSourceBarClass(sourceType) {
        const map = { ASSIGNED: 'bg-orange-500', PERSONAL: 'bg-green-600', RECURRING: 'bg-purple-600', SYSTEM: 'bg-gray-400' };
        return (this.myTasks && sourceType) ? (map[sourceType] || 'bg-orange-500') : 'bg-orange-500';
      },
      taskGanttBarStyle(t) {
        const days = this.calendarDaysInMonth;
        if (!t.DueDate || days.length === 0) return 'visibility:hidden;';
        const idx = days.findIndex((d) => d.dateStr === t.DueDate);
        if (idx === -1) return 'visibility:hidden;';
        const startCol = idx + 2; // cột 1 = tên việc
        const bg = t.IsOverdue ? '#dc2626' : '';
        return 'grid-column:' + startCol + ' / span 1;' + (bg ? 'background:' + bg + ';' : '');
      },
      taskStatusLabel(t) {
        if (t.IsOverdue) return 'QUÁ HẠN';
        const map = { ASSIGNED: 'Chưa bắt đầu', IN_PROGRESS: 'Đang thực hiện', SUBMITTED: 'Chờ xác nhận', EVALUATED: 'Hoàn thành', CANCELLED: 'Đã huỷ' };
        return map[t.Status] || t.Status;
      },
      taskStatusBadgeClass(t) {
        if (t.IsOverdue) return 'badge-red';
        const map = { ASSIGNED: 'badge-gray', IN_PROGRESS: 'badge-orange', SUBMITTED: 'badge-purple', EVALUATED: 'badge-green', CANCELLED: 'badge-gray' };
        return map[t.Status] || 'badge-gray';
      },
      taskPriorityLabel(p) {
        const map = { LOW: 'Thấp', NORMAL: 'Bình thường', HIGH: 'Cao', URGENT: 'Khẩn' };
        return map[p] || p;
      },
      taskPriorityFlag(p) {
        const map = { LOW: '⬇', NORMAL: '➖', HIGH: '⬆', URGENT: '🔴' };
        return map[p] || '';
      },
      taskDueRelativeLabel(t) {
        if (!t.DueDate) return '';
        if (t.IsOverdue) {
          const days = Math.max(1, Math.round((new Date(this.todayDateStr_()) - new Date(t.DueDate)) / 86400000));
          return 'Trễ ' + days + ' ngày';
        }
        const days = Math.round((new Date(t.DueDate) - new Date(this.todayDateStr_())) / 86400000);
        if (days === 0) return 'Hôm nay';

      get permissionMgmtUsersFiltered() {

        return this.allUsers.filter((u) => {
          if (q && !(u.FullName || '').toLowerCase().includes(q) && !(u.Email || '').toLowerCase().includes(q)) return false;
          if (this.permissionMgmtRoleFilter && u.Role !== this.permissionMgmtRoleFilter) return false;
          if (this.permissionMgmtDeptFilter) {
            const emp = this.employees.find((e) => e.UserID === u.UserID);
            if (!emp || emp.DepartmentID !== this.permissionMgmtDeptFilter) return false;
          }
          return true;
        });
      },
      get permissionMgmtPageCount() {
        return Math.max(1, Math.ceil(this.permissionMgmtUsersFiltered.length / this.permissionMgmtPageSize));
      },
      get permissionMgmtPageStart() {
        return this.permissionMgmtUsersFiltered.length === 0 ? 0 : (this.permissionMgmtPage - 1) * this.permissionMgmtPageSize + 1;

      get permissionMgmtPageEnd() {
        return Math.min(this.permissionMgmtPage * this.permissionMgmtPageSize, this.permissionMgmtUsersFiltered.length);
      },
      get permissionMgmtUsersPage() {
        if (this.permissionMgmtPage > this.permissionMgmtPageCount) this.permissionMgmtPage = this.permissionMgmtPageCount;

        return this.permissionMgmtUsersFiltered.slice(start, start + this.permissionMgmtPageSize);

        const g = this.grantForModule(moduleKey);
        if (!g || g.Status === 'Revoked') return;
        g.CanDelegate = !g.CanDelegate;
        this.saveGrantAction(g);
      },
      setModuleScopeAction(moduleKey, departmentId) {
        if (!departmentId) return;
        const actions = ['CanView', 'CanCreate', 'CanEdit', 'CanDelete', 'CanSubmit', 'CanApprove', 'CanReject', 'CanPublish', 'CanLock', 'CanExport'];
        const patch = actions.reduce((a, act) => { a[act] = false; return a; }, {});
        google.script.run
          .withSuccessHandler(() => { this.loadPermissionDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_grantUserPermission(this.authToken, this.selectedPermissionUserId, departmentId, moduleKey, patch, {});
      },
      saveAllModuleNotesAction() {
        this.selectedPermissionUserGrants.forEach((p) => { p.Note = this.permissionGrantNote; this.saveGrantAction(p); });
      },
      revokeGrantAction(p) {
        if (!confirm('Thu hồi phân quyền phạm vi "' + (p.DepartmentID === '*' ? 'Toàn viện' : this.departmentNameById(p.DepartmentID)) + '"?')) return;
        google.script.run
          .withSuccessHandler(() => { this.loadPermissionDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_revokePermissionGrant(this.authToken, p.PermissionID);
      },
      restoreGrantAction(p) {
        google.script.run
          .withSuccessHandler(() => { this.loadPermissionDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_restorePermissionGrant(this.authToken, p.PermissionID);
      },
      loadPermissionHistoryAction() {
        google.script.run
          .withSuccessHandler((logs) => { this.permissionHistory = logs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listPermissionChangeHistory(this.authToken, this.selectedPermissionUserId);
      },

      toggleAi() {
        google.script.run
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_setAiEnabled(this.authToken, this.aiEnabled);
      },

      saveAiConfig() {
        this.savingAiConfig = true;
        google.script.run
          .withSuccessHandler(() => {
            this.savingAiConfig = false;
            this.aiForm.apiKey = '';
            this.loadAdminData();
          })
          .withFailureHandler((e) => {
            this.savingAiConfig = false;
            this.errorMessage = e.message;
          })
          .api_updateAIProviderConfig(this.authToken, this.aiForm.providerId, this.aiForm.modelName, this.aiForm.apiKey, this.aiForm.temperature, this.aiForm.maxTokens, this.aiForm.timeout);
      },

      syncSchemaAction() {
        this.syncingSchema = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.syncingSchema = false;
            this.schemaSyncResult = result;
          })
          .withFailureHandler((e) => {
            this.syncingSchema = false;
            this.errorMessage = e.message;
          })
          .api_syncSchemaWithSpreadsheet(this.authToken);
      },

      auditFilters: { userId: '', action: '', fromDate: '', toDate: '' },
      auditFiltersActive() {
        const f = this.auditFilters;
        return f.userId || f.action || f.fromDate || f.toDate;
      },
      clearAuditFilters() {
        this.auditFilters = { userId: '', action: '', fromDate: '', toDate: '' };
        this.loadAuditLog();
      },
      // Input type=date chỉ có ngày (YYYY-MM-DD) — Timestamp lưu ISO đầy đủ có giờ (nowIso()), nên
      // phải ghép giờ đầu/cuối ngày mới bao trọn được cả ngày khi so sánh chuỗi >=/<= ở backend.
      buildAuditApiFilters_() {
        const f = this.auditFilters;
        return {
          userId: f.userId || '',
          action: f.action || '',
          fromDate: f.fromDate ? f.fromDate + 'T00:00:00.000Z' : '',
          toDate: f.toDate ? f.toDate + 'T23:59:59.999Z' : ''
        };
      },

      loadAuditLog() {
        google.script.run
          .withSuccessHandler((logs) => { this.auditLogs = logs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_searchAuditLog(this.authToken, this.buildAuditApiFilters_());
      },

      exportAuditLogAction() {
        this.exportingAuditLog = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.exportingAuditLog = false;
            this.auditExportResult = result;
          })
          .withFailureHandler((e) => {
            this.exportingAuditLog = false;
            this.errorMessage = e.message;
          })
          .api_exportAuditLogToExcel(this.authToken, this.buildAuditApiFilters_());
      }
    };
  }
</script>
