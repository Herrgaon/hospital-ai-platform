<!-- Alpine.js qua CDN — ghim phiên bản cụ thể (không dùng range @3.x.x thả nổi) + SRI. Nâng phiên bản:
     đổi cả version trong URL lẫn hash integrity cùng lúc. -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
        integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
        crossorigin="anonymous"></script>
<script>
  function appShell() {
    return {
      // --- Đăng nhập (mã nhân viên + mật khẩu qua Gateway — KHÔNG còn dựa vào phiên Google, xem
      // Auth.Session.gs). Token lưu ở localStorage để giữ đăng nhập qua các lần tải lại trang; mỗi lệnh
      // gọi google.script.run...api_xxx() đều truyền this.authToken làm tham số đầu tiên. ---
      authToken: '',
      loginForm: { employeeCode: '', password: '' },
      loggingIn: false,
      loginError: '',

      userEmail: '',
      currentUser: {},
      myEmployeeId: '',
      get isSuperAdmin() { return this.currentUser.Role === 'SUPER_ADMIN'; },
      get isTcHc() { return this.currentUser.Role === 'PHONG_TC_HC'; },
      get isKhNv() { return this.currentUser.Role === 'PHONG_KH_NV'; },
      get isBanGiamDoc() { return this.currentUser.Role === 'BAN_GIAM_DOC'; },
      myPermissionMap: {},
      can(departmentId, action) {
        if (this.isSuperAdmin) return true;
        return !!(this.myPermissionMap[departmentId] && this.myPermissionMap[departmentId][action]);
      },
      canAnywhere(action) {
        if (this.isSuperAdmin) return true;
        return Object.values(this.myPermissionMap).some((p) => p[action]);
      },
      showProfileMenu: false,
      profileForm: { fullName: '' },
      savingProfile: false,
      pendingAvatarFile: null,
      uploadingAvatar: false,
      aiEnabled: false,
      errorMessage: '',

      departments: [],
      employees: [],
      userDirectory: [],

      init() {
        // errorMessage được gán ở rất nhiều chỗ (withFailureHandler) nhưng theo dõi tập trung ở đây để
        // MỌI lỗi tự động hiện thành toast, không cần sửa lại từng chỗ gọi.
        this.$watch('errorMessage', (value) => { if (value) this.toast('error', value); });

        this.currentView = (location.hash || '#dashboard').replace('#', '');
        if (!document.documentElement.classList.contains('theme-loaded')) {
          document.documentElement.classList.add('theme-loaded');
          if (localStorage.getItem('theme') === 'dark' ||
              (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        }

        google.script.run
          .withSuccessHandler((enabled) => { this.aiEnabled = enabled; })
          .withFailureHandler(() => {})
          .api_isAiEnabled();

        const savedToken = localStorage.getItem('bvds_auth_token');
        if (savedToken) {
          this.authToken = savedToken;
          this.loadCurrentUserAndAppData_();
        }
      },

      // Gọi lại sau login thành công VÀ khi khôi phục token đã lưu từ localStorage lúc mở trang —
      // xác thực token còn dùng được (api_getCurrentUser sẽ báo lỗi nếu token hết hạn/không hợp lệ)
      // trước khi nạp toàn bộ dữ liệu ứng dụng.
      loadCurrentUserAndAppData_() {
        google.script.run
          .withSuccessHandler((user) => {
            this.userEmail = user.Email;
            this.currentUser = user;
            this.profileForm.fullName = user.FullName;
            this.loadAppData_();
          })
          .withFailureHandler(() => {
            // Token hết hạn/không hợp lệ — quay lại màn hình đăng nhập, không hiện lỗi ồn ào.
            this.authToken = '';
            localStorage.removeItem('bvds_auth_token');
          })
          .api_getCurrentUser(this.authToken);
      },

      loadAppData_() {
        google.script.run
          .withSuccessHandler((employee) => { this.myEmployeeId = employee ? employee.EmployeeID : ''; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getMyEmployee(this.authToken);

        google.script.run
          .withSuccessHandler((map) => { this.myPermissionMap = map; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getMyPermissionMap(this.authToken);

        google.script.run
          .withSuccessHandler((depts) => { this.departments = depts; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listActiveDepartments(this.authToken);

        google.script.run
          .withSuccessHandler((emps) => { this.employees = emps; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listEmployees(this.authToken);

        google.script.run
          .withSuccessHandler((dir) => { this.userDirectory = dir; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listUserDirectory(this.authToken);

        this.loadSwapPageData();
      },

      loginAction() {
        this.loggingIn = true;
        this.loginError = '';
        google.script.run
          .withSuccessHandler((result) => {
            this.loggingIn = false;
            this.authToken = result.token;
            localStorage.setItem('bvds_auth_token', result.token);
            this.currentUser = result.user;
            this.userEmail = result.user.Email;
            this.profileForm.fullName = result.user.FullName;
            this.loginForm = { employeeCode: '', password: '' };
            this.loadAppData_();
          })
          .withFailureHandler((e) => {
            this.loggingIn = false;
            this.loginError = e.message;
          })
          .api_login(this.loginForm.employeeCode, this.loginForm.password);
      },

      logoutAction() {
        const token = this.authToken;
        this.authToken = '';
        this.currentUser = {};
        localStorage.removeItem('bvds_auth_token');
        this.currentView = 'dashboard';
        google.script.run.withFailureHandler(() => {}).api_logout(token);
      },

      active(view) {
        return this.currentView === view ? 'active' : '';
      },

      // Điều hướng thuần JS — KHÔNG dùng <a href="#..."> điều hướng gốc, vì <base target="_top">
      // (cần thiết cho các link tải file mở tab mới) khiến trình duyệt cố điều hướng frame trên
      // cùng ra khỏi sandbox iframe của Apps Script, gây văng ra trang trắng userCodeAppPanel.
      go(view) {
        this.currentView = view;
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', '#' + view);
        }
      },

      toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      },

      // --- Toast & Modal (dùng chung toàn app) ---
      toasts: [],
      toastSeq: 0,
      toast(type, message) {
        const id = ++this.toastSeq;
        this.toasts.push({ id, type, message });
        setTimeout(() => { this.toasts = this.toasts.filter((t) => t.id !== id); }, 3500);
      },

      modalOpen: null,
      openModal(name) { this.modalOpen = name; },
      closeModal() { this.modalOpen = null; },

      get pendingCount() {
        return this.pendingSwapConfirmations.length;
      },

      // --- Avatar (dùng chung: bảng người dùng, danh bạ, top bar) ---
      initials(user) {
        const label = (user && (user.FullName || user.Email)) || '?';
        const parts = label.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return label.substring(0, 2).toUpperCase();
      },

      avatarColorStyle(user) {
        const key = (user && (user.UserID || user.EmployeeID || user.Email)) || '?';
        const palette = ['#0891b2', '#0e7490', '#7c3aed', '#be185d', '#b45309', '#15803d', '#1d4ed8'];
        let hash = 0;
        for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
        const color = palette[hash % palette.length];
        return 'background-color:' + color + '; color:#ffffff;';
      },

      // --- Lookup dùng chung ---
      userEmailById(userId) {
        const u = this.userDirectory.find((x) => x.UserID === userId);
        return u ? u.Email : userId;
      },

      departmentNameById(departmentId) {
        const d = this.departments.find((x) => x.DepartmentID === departmentId);
        return d ? d.DepartmentName : departmentId;
      },

      departmentTypeLabel(type) {
        const map = {
          BAN_GIAM_DOC: 'Ban Giám đốc', PHONG_CHUC_NANG: 'Phòng chức năng',
          KHOA_LAM_SANG: 'Khoa lâm sàng', KHOA_CAN_LAM_SANG: 'Khoa cận lâm sàng'
        };
        return map[type] || type;
      },

      employeeNameById(employeeId) {
        const e = this.employees.find((x) => x.EmployeeID === employeeId);
        return e ? e.FullName : employeeId;
      },

      employeesByDepartment(departmentId) {
        if (!departmentId) return [];
        return this.employees.filter((e) => e.DepartmentID === departmentId && e.Status === 'Active');
      },

      saveProfileAction() {
        this.savingProfile = true;
        google.script.run
          .withSuccessHandler(() => {
            this.savingProfile = false;
            this.currentUser.FullName = this.profileForm.fullName;
          })
          .withFailureHandler((e) => {
            this.savingProfile = false;
            this.errorMessage = e.message;
          })
          .api_updateMyProfile(this.authToken, this.profileForm.fullName);
      },

      onAvatarFileSelected(event) {
        const file = event.target.files[0];
        if (!file) { this.pendingAvatarFile = null; return; }
        const reader = new FileReader();
        reader.onload = () => {
          this.pendingAvatarFile = { mimeType: file.type || 'image/png', base64: reader.result.split(',')[1] };
          this.uploadAvatarAction();
        };
        reader.readAsDataURL(file);
      },

      uploadAvatarAction() {
        if (!this.pendingAvatarFile) return;
        this.uploadingAvatar = true;
        google.script.run
          .withSuccessHandler((updated) => {
            this.uploadingAvatar = false;
            this.pendingAvatarFile = null;
            this.currentUser.AvatarUrl = updated.AvatarUrl;
          })
          .withFailureHandler((e) => {
            this.uploadingAvatar = false;
            this.errorMessage = e.message;
          })
          .api_updateMyAvatar(this.authToken, this.pendingAvatarFile.base64, this.pendingAvatarFile.mimeType);
      },

      // --- Dashboard ---
      dashboard: { myTasks: [], myShiftsThisWeek: [], pendingSwapConfirmations: [] },
      loadDashboard() {
        google.script.run
          .withSuccessHandler((summary) => { this.dashboard = summary; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getDashboardSummary(this.authToken);
      },

      // --- Nhân sự ---
      employeeFilters: { departmentId: '' },
      get employeesFiltered() {
        return this.employeeFilters.departmentId
          ? this.employees.filter((e) => e.DepartmentID === this.employeeFilters.departmentId)
          : this.employees;
      },
      loadEmployeesPage() {
        google.script.run
          .withSuccessHandler((emps) => { this.employees = emps; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listEmployees(this.authToken);
      },
      newEmployeeForm: { employeeCode: '', email: '', fullName: '', departmentId: '', position: '', employeeType: '', phoneNumber: '', startDate: '' },
      creatingEmployee: false,
      openAddEmployeeModal() {
        this.newEmployeeForm = { employeeCode: '', email: '', fullName: '', departmentId: '', position: '', employeeType: '', phoneNumber: '', startDate: '' };
        this.openModal('addEmployee');
      },
      createEmployeeAction() {
        this.creatingEmployee = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingEmployee = false;
            this.closeModal();
            this.toast('success', 'Đã thêm nhân viên mới.');
            this.loadEmployeesPage();
          })
          .withFailureHandler((e) => {
            this.creatingEmployee = false;
            this.errorMessage = e.message;
          })
          .api_createEmployee(this.authToken, this.newEmployeeForm);
      },
      deactivateEmployeeAction(e) {
        if (!confirm('Ngừng hoạt động nhân viên "' + e.FullName + '"? Tài khoản đăng nhập của họ cũng sẽ bị khoá.')) return;
        google.script.run
          .withSuccessHandler(() => { this.loadEmployeesPage(); })
          .withFailureHandler((err) => { this.errorMessage = err.message; })
          .api_deactivateEmployee(this.authToken, e.EmployeeID);
      },

      resetPasswordTarget: null,
      resetPasswordForm: { newPassword: '' },
      resettingPassword: false,
      openResetPasswordModal(e) {
        this.resetPasswordTarget = e;
        this.resetPasswordForm = { newPassword: '' };
        this.openModal('resetEmployeePassword');
      },
      resetEmployeePasswordAction() {
        this.resettingPassword = true;
        google.script.run
          .withSuccessHandler(() => {
            this.resettingPassword = false;
            this.closeModal();
            this.toast('success', 'Đã đặt lại mật khẩu.');
          })
          .withFailureHandler((e) => {
            this.resettingPassword = false;
            this.errorMessage = e.message;
          })
          .api_resetEmployeePassword(this.authToken, this.resetPasswordTarget.EmployeeID, this.resetPasswordForm.newPassword);
      },

      changePasswordForm: { oldPassword: '', newPassword: '' },
      changingPassword: false,
      openChangePasswordModal() {
        this.changePasswordForm = { oldPassword: '', newPassword: '' };
        this.openModal('changePassword');
      },
      changeMyPasswordAction() {
        this.changingPassword = true;
        google.script.run
          .withSuccessHandler(() => {
            this.changingPassword = false;
            this.closeModal();
            this.toast('success', 'Đã đổi mật khẩu.');
          })
          .withFailureHandler((e) => {
            this.changingPassword = false;
            this.errorMessage = e.message;
          })
          .api_changeMyPassword(this.authToken, this.changePasswordForm.oldPassword, this.changePasswordForm.newPassword);
      },

      // --- Khoa/Phòng ---
      loadDepartmentsPage() {
        google.script.run
          .withSuccessHandler((depts) => { this.departments = depts; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listActiveDepartments(this.authToken);
      },
      newDepartmentForm: { departmentName: '', departmentType: 'KHOA_LAM_SANG', headUserId: '' },
      creatingDepartment: false,
      openAddDepartmentModal() {
        this.newDepartmentForm = { departmentName: '', departmentType: 'KHOA_LAM_SANG', headUserId: '' };
        this.openModal('addDepartment');
      },
      createDepartmentAction() {
        this.creatingDepartment = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingDepartment = false;
            this.closeModal();
            this.toast('success', 'Đã thêm khoa/phòng mới.');
            this.loadDepartmentsPage();
          })
          .withFailureHandler((e) => {
            this.creatingDepartment = false;
            this.errorMessage = e.message;
          })
          .api_createDepartment(this.authToken, this.newDepartmentForm);
      },
      updateDepartmentHeadAction(d) {
        google.script.run
          .withSuccessHandler(() => { this.toast('success', 'Đã cập nhật trưởng khoa/phòng.'); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_updateDepartment(this.authToken, d.DepartmentID, { headUserId: d.HeadUserID });
      },
      deactivateDepartmentAction(d) {
        if (!confirm('Ngừng hoạt động khoa/phòng "' + d.DepartmentName + '"?')) return;
        google.script.run
          .withSuccessHandler(() => { this.loadDepartmentsPage(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_deactivateDepartment(this.authToken, d.DepartmentID);
      },

      // --- Quản lý công việc ---
      taskTab: 'mine',
      myTasks: [],
      departmentTasks: [],
      taskDepartmentFilter: '',
      loadMyTasksAction() {
        google.script.run
          .withSuccessHandler((tasks) => { this.myTasks = tasks; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listMyTasks(this.authToken);
      },
      loadDepartmentTasksAction() {
        if (!this.taskDepartmentFilter) { this.departmentTasks = []; return; }
        google.script.run
          .withSuccessHandler((tasks) => { this.departmentTasks = tasks; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listTasksByDepartment(this.authToken, this.taskDepartmentFilter);
      },
      assignTaskForm: { departmentId: '', assigneeEmployeeId: '', title: '', description: '', dueDate: '', priority: 'NORMAL' },
      assigningTask: false,
      openAssignTaskModal() {
        this.assignTaskForm = { departmentId: '', assigneeEmployeeId: '', title: '', description: '', dueDate: '', priority: 'NORMAL' };
        this.openModal('assignTask');
      },
      onAssignTaskDepartmentChange() { this.assignTaskForm.assigneeEmployeeId = ''; },
      assignTaskAction() {
        this.assigningTask = true;
        google.script.run
          .withSuccessHandler(() => {
            this.assigningTask = false;
            this.closeModal();
            this.toast('success', 'Đã giao việc.');
            this.loadMyTasksAction();
            if (this.taskDepartmentFilter) this.loadDepartmentTasksAction();
          })
          .withFailureHandler((e) => {
            this.assigningTask = false;
            this.errorMessage = e.message;
          })
          .api_assignTask(this.authToken, this.assignTaskForm);
      },
      currentTask: null,
      taskProgressInput: 0,
      taskResultInput: '',
      taskEvaluationForm: { score: null, comment: '' },
      openTaskDetail(t) {
        this.currentTask = t;
        this.taskProgressInput = t.Progress || 0;
        this.taskResultInput = '';
        this.taskEvaluationForm = { score: null, comment: '' };
        this.openModal('taskDetail');
      },
      refreshCurrentTask_(updated) {
        this.currentTask = updated;
        this.myTasks = this.myTasks.map((t) => t.TaskID === updated.TaskID ? updated : t);
        this.departmentTasks = this.departmentTasks.map((t) => t.TaskID === updated.TaskID ? updated : t);
      },
      updateTaskProgressAction() {
        google.script.run
          .withSuccessHandler((updated) => { this.refreshCurrentTask_(updated); this.toast('success', 'Đã cập nhật tiến độ.'); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_updateTaskProgress(this.authToken, this.currentTask.TaskID, this.taskProgressInput);
      },
      submitTaskResultAction() {
        google.script.run
          .withSuccessHandler((updated) => { this.refreshCurrentTask_(updated); this.taskResultInput = ''; this.toast('success', 'Đã nộp kết quả.'); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_submitTaskResult(this.authToken, this.currentTask.TaskID, this.taskResultInput);
      },
      evaluateTaskAction() {
        google.script.run
          .withSuccessHandler((updated) => { this.refreshCurrentTask_(updated); this.toast('success', 'Đã lưu đánh giá.'); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_evaluateTask(this.authToken, this.currentTask.TaskID, this.taskEvaluationForm);
      },

      // --- Phân công khối lâm sàng ---
      clinicalTab: 'mine',
      myClinicalAssignments: [],
      departmentClinicalAssignments: [],
      clinicalDepartmentFilter: '',
      loadMyClinicalAssignmentsAction() {
        google.script.run
          .withSuccessHandler((rows) => { this.myClinicalAssignments = rows; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listMyClinicalAssignments(this.authToken, null, null);
      },
      loadDepartmentClinicalAssignmentsAction() {
        if (!this.clinicalDepartmentFilter) { this.departmentClinicalAssignments = []; return; }
        google.script.run
          .withSuccessHandler((rows) => { this.departmentClinicalAssignments = rows; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listClinicalAssignmentsByDepartment(this.authToken, this.clinicalDepartmentFilter, null, null);
      },
      clinicalAssignmentForm: { departmentId: '', employeeId: '', assignmentDate: '', workType: 'Khám', shiftStart: '', shiftEnd: '', notes: '' },
      creatingClinicalAssignment: false,
      openAddClinicalAssignmentModal() {
        this.clinicalAssignmentForm = { departmentId: '', employeeId: '', assignmentDate: '', workType: 'Khám', shiftStart: '', shiftEnd: '', notes: '' };
        this.openModal('addClinicalAssignment');
      },
      onClinicalAssignmentDepartmentChange() { this.clinicalAssignmentForm.employeeId = ''; },
      createClinicalAssignmentAction() {
        this.creatingClinicalAssignment = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingClinicalAssignment = false;
            this.closeModal();
            this.toast('success', 'Đã lưu phân công.');
            this.loadMyClinicalAssignmentsAction();
            if (this.clinicalDepartmentFilter) this.loadDepartmentClinicalAssignmentsAction();
          })
          .withFailureHandler((e) => {
            this.creatingClinicalAssignment = false;
            this.errorMessage = e.message;
          })
          .api_createClinicalAssignment(this.authToken, this.clinicalAssignmentForm);
      },
      deleteClinicalAssignmentAction(a) {
        if (!confirm('Xoá phân công ngày ' + a.AssignmentDate + '?')) return;
        google.script.run
          .withSuccessHandler(() => { this.loadDepartmentClinicalAssignmentsAction(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_deleteClinicalAssignment(this.authToken, a.AssignmentID);
      },

      // --- Lịch trực tuần ---
      dutyDepartmentFilter: '',
      dutySchedules: [],
      currentDutySchedule: null,
      loadDutySchedulesAction() {
        if (!this.dutyDepartmentFilter) { this.dutySchedules = []; return; }
        google.script.run
          .withSuccessHandler((rows) => { this.dutySchedules = rows; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listDutySchedulesByDepartment(this.authToken, this.dutyDepartmentFilter);
      },
      dutyStatusLabel(status) {
        const map = {
          DRAFT: 'Nháp', SUBMITTED: 'Đã gửi duyệt', UNDER_REVIEW: 'Đang xét duyệt',
          NEED_REVISION: 'Cần chỉnh sửa', APPROVED: 'Đã duyệt', PUBLISHED: 'Đã công bố'
        };
        return map[status] || status;
      },
      dutyStatusBadgeClass(status) {
        const map = {
          DRAFT: 'badge-gray', SUBMITTED: 'badge-cyan', UNDER_REVIEW: 'badge-orange',
          NEED_REVISION: 'badge-red', APPROVED: 'badge-purple', PUBLISHED: 'badge-green'
        };
        return map[status] || 'badge-gray';
      },
      isDutyScheduleEditable(schedule) {
        return schedule.Status === 'DRAFT' || schedule.Status === 'NEED_REVISION';
      },
      newDutyScheduleForm: { weekStartDate: '', weekEndDate: '' },
      creatingDutySchedule: false,
      openAddDutyScheduleModal() {
        this.newDutyScheduleForm = { weekStartDate: '', weekEndDate: '' };
        this.openModal('addDutySchedule');
      },
      createDutyScheduleAction() {
        this.creatingDutySchedule = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingDutySchedule = false;
            this.closeModal();
            this.toast('success', 'Đã tạo lịch trực tuần.');
            this.loadDutySchedulesAction();
          })
          .withFailureHandler((e) => {
            this.creatingDutySchedule = false;
            this.errorMessage = e.message;
          })
          .api_createDutySchedule(this.authToken, this.dutyDepartmentFilter, this.newDutyScheduleForm.weekStartDate, this.newDutyScheduleForm.weekEndDate);
      },
      openDutyScheduleDetail(s) {
        google.script.run
          .withSuccessHandler((detail) => {
            this.currentDutySchedule = detail;
            this.openModal('dutyScheduleDetail');
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getDutyScheduleDetail(this.authToken, s.DutyScheduleID);
      },
      refreshCurrentDutyScheduleDetail_() {
        google.script.run
          .withSuccessHandler((detail) => {
            this.currentDutySchedule = detail;
            this.dutySchedules = this.dutySchedules.map((s) => s.DutyScheduleID === detail.schedule.DutyScheduleID ? detail.schedule : s);
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getDutyScheduleDetail(this.authToken, this.currentDutySchedule.schedule.DutyScheduleID);
      },
      addShiftForm: { shiftDate: '', dutyType: '', employeeId: '', roleInShift: '', shiftStart: '', shiftEnd: '', notes: '' },
      addingShift: false,
      openAddShiftModal() {
        this.addShiftForm = { shiftDate: this.currentDutySchedule.schedule.WeekStartDate, dutyType: '', employeeId: '', roleInShift: '', shiftStart: '', shiftEnd: '', notes: '' };
        this.openModal('addShift');
      },
      addDutyShiftAction() {
        this.addingShift = true;
        google.script.run
          .withSuccessHandler(() => {
            this.addingShift = false;
            this.closeModal();
            this.refreshCurrentDutyScheduleDetail_();
            this.openModal('dutyScheduleDetail');
          })
          .withFailureHandler((e) => {
            this.addingShift = false;
            this.errorMessage = e.message;
          })
          .api_addDutyShift(this.authToken, this.currentDutySchedule.schedule.DutyScheduleID, this.addShiftForm);
      },
      removeDutyShiftAction(sh) {
        if (!confirm('Xoá ca trực ngày ' + sh.ShiftDate + '?')) return;
        google.script.run
          .withSuccessHandler(() => { this.refreshCurrentDutyScheduleDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_removeDutyShift(this.authToken, sh.DutyShiftID);
      },
      submitDutyScheduleAction() {
        google.script.run
          .withSuccessHandler(() => { this.toast('success', 'Đã gửi duyệt lịch trực.'); this.refreshCurrentDutyScheduleDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_submitDutySchedule(this.authToken, this.currentDutySchedule.schedule.DutyScheduleID);
      },
      markDutyScheduleUnderReviewAction() {
        google.script.run
          .withSuccessHandler(() => { this.refreshCurrentDutyScheduleDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_markDutyScheduleUnderReview(this.authToken, this.currentDutySchedule.schedule.DutyScheduleID);
      },
      requestDutyScheduleRevisionAction() {
        const comment = prompt('Lý do yêu cầu chỉnh sửa:');
        if (comment === null) return;
        google.script.run
          .withSuccessHandler(() => { this.toast('info', 'Đã yêu cầu chỉnh sửa.'); this.refreshCurrentDutyScheduleDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_requestDutyScheduleRevision(this.authToken, this.currentDutySchedule.schedule.DutyScheduleID, comment);
      },
      approveDutyScheduleAction() {
        google.script.run
          .withSuccessHandler(() => { this.toast('success', 'Đã duyệt lịch trực.'); this.refreshCurrentDutyScheduleDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_approveDutySchedule(this.authToken, this.currentDutySchedule.schedule.DutyScheduleID, '');
      },
      publishDutyScheduleAction() {
        google.script.run
          .withSuccessHandler(() => { this.toast('success', 'Đã công bố lịch trực toàn viện.'); this.refreshCurrentDutyScheduleDetail_(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_publishDutySchedule(this.authToken, this.currentDutySchedule.schedule.DutyScheduleID);
      },
      printCurrentDutySchedule() {
        window.print();
      },

      // --- Đổi trực ---
      myOfficialDutyShifts: [],
      mySwapRequests: [],
      pendingSwapConfirmations: [],
      loadSwapPageData() {
        if (!this.authToken) return;
        google.script.run
          .withSuccessHandler((rows) => { this.myOfficialDutyShifts = rows.filter((s) => s.Status === 'OFFICIAL'); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listMyDutyShifts(this.authToken, null, null);
        google.script.run
          .withSuccessHandler((rows) => { this.mySwapRequests = rows; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listMySwapRequests(this.authToken);
        google.script.run
          .withSuccessHandler((rows) => { this.pendingSwapConfirmations = rows; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listPendingSwapConfirmations(this.authToken);
      },
      swapStatusLabel(status) {
        const map = {
          REQUESTED: 'Chờ người thay thế xác nhận', REPLACEMENT_CONFIRMED: 'Chờ trưởng khoa xác nhận',
          DEPT_HEAD_CONFIRMED: 'Chờ Phòng KH-NV duyệt', KHNV_APPROVED: 'Đã duyệt', REJECTED: 'Đã từ chối'
        };
        return map[status] || status;
      },
      requestSwapForm: { shift: null, replacementEmployeeId: '', reason: '' },
      requestingSwap: false,
      openRequestSwapModal(shift) {
        this.requestSwapForm = { shift: shift, replacementEmployeeId: '', reason: '' };
        this.openModal('requestSwap');
      },
      requestDutySwapAction() {
        this.requestingSwap = true;
        google.script.run
          .withSuccessHandler(() => {
            this.requestingSwap = false;
            this.closeModal();
            this.toast('success', 'Đã gửi đề nghị đổi trực.');
            this.loadSwapPageData();
          })
          .withFailureHandler((e) => {
            this.requestingSwap = false;
            this.errorMessage = e.message;
          })
          .api_requestDutySwap(this.authToken, {
            originalShiftId: this.requestSwapForm.shift.DutyShiftID,
            replacementEmployeeId: this.requestSwapForm.replacementEmployeeId,
            reason: this.requestSwapForm.reason
          });
      },
      confirmSwapReplacementAction(sw) {
        google.script.run
          .withSuccessHandler(() => { this.toast('success', 'Đã xác nhận.'); this.loadSwapPageData(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_confirmDutySwapByReplacement(this.authToken, sw.SwapRequestID);
      },
      confirmSwapDeptHeadAction(sw) {
        google.script.run
          .withSuccessHandler(() => { this.toast('success', 'Trưởng khoa đã xác nhận.'); this.loadSwapPageData(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_confirmDutySwapByDeptHead(this.authToken, sw.SwapRequestID);
      },
      approveSwapKhNvAction(sw) {
        google.script.run
          .withSuccessHandler(() => { this.toast('success', 'Đã duyệt đổi trực.'); this.loadSwapPageData(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_approveDutySwapByKhNv(this.authToken, sw.SwapRequestID);
      },
      rejectSwapAction(sw) {
        const reason = prompt('Lý do từ chối:');
        if (reason === null) return;
        google.script.run
          .withSuccessHandler(() => { this.toast('info', 'Đã từ chối đổi trực.'); this.loadSwapPageData(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_rejectDutySwap(this.authToken, sw.SwapRequestID, reason);
      },

      // --- Quản trị ---
      adminTab: 'users',
      newUserForm: { email: '', fullName: '', role: 'NHAN_VIEN' },
      creatingUser: false,
      syncingSchema: false,
      schemaSyncResult: null,
      allUsers: [],
      allRoles: [],
      activeAiConfig: null,
      aiProviders: [],
      aiForm: { providerId: '', modelName: '', apiKey: '', temperature: 0.3, maxTokens: 1024, timeout: 30 },
      savingAiConfig: false,
      auditLogs: [],
      exportingAuditLog: false,
      auditExportResult: null,
      permissionDepartmentFilter: '',
      departmentPermissions: [],
      newPermissionUserId: '',

      loadAdminData() {
        google.script.run.withSuccessHandler((users) => { this.allUsers = users; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_listAllUsers(this.authToken);
        google.script.run.withSuccessHandler((roles) => { this.allRoles = roles; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_getAllRoles();
        google.script.run.withSuccessHandler((providers) => { this.aiProviders = providers; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_listAIProviders(this.authToken);
        google.script.run.withSuccessHandler((enabled) => { this.aiEnabled = enabled; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_isAiEnabled();
        google.script.run.withSuccessHandler((config) => { this.activeAiConfig = config; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_getActiveAIProviderConfig(this.authToken);
      },

      saveUserRole(u) {
        google.script.run
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_assignRole(this.authToken, u.UserID, u.Role);
        google.script.run
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_updateUserProfile(this.authToken, u.UserID, u.FullName, u.Department || '');
      },

      createUserAction() {
        this.creatingUser = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingUser = false;
            this.newUserForm = { email: '', fullName: '', role: 'NHAN_VIEN' };
            this.closeModal();
            this.toast('success', 'Đã thêm người dùng mới.');
            this.loadAdminData();
          })
          .withFailureHandler((e) => {
            this.creatingUser = false;
            this.errorMessage = e.message;
          })
          .api_createUser(this.authToken, this.newUserForm.email, this.newUserForm.fullName, this.newUserForm.role, '');
      },

      loadDepartmentPermissionsAction() {
        if (!this.permissionDepartmentFilter) { this.departmentPermissions = []; return; }
        google.script.run
          .withSuccessHandler((perms) => { this.departmentPermissions = perms; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listPermissionsForDepartment(this.authToken, this.permissionDepartmentFilter);
      },

      addPermissionRowAction() {
        if (!this.newPermissionUserId) return;
        if (this.departmentPermissions.some((p) => p.UserID === this.newPermissionUserId)) {
          this.newPermissionUserId = '';
          return;
        }
        this.departmentPermissions.push({
          PermissionID: 'NEW_' + this.newPermissionUserId,
          UserID: this.newPermissionUserId,
          DepartmentID: this.permissionDepartmentFilter,
          CanView: true, CanCreate: false, CanEdit: false, CanDelete: false,
          CanSubmit: false, CanApprove: false, CanReject: false, CanPublish: false, CanLock: false, CanExport: false
        });
        this.newPermissionUserId = '';
      },

      savePermissionRowAction(perm) {
        google.script.run
          .withSuccessHandler(() => { this.loadDepartmentPermissionsAction(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_setEmployeePermissionOverride(this.authToken, perm.UserID, this.permissionDepartmentFilter, {
            CanView: perm.CanView, CanCreate: perm.CanCreate, CanEdit: perm.CanEdit, CanDelete: perm.CanDelete,
            CanSubmit: perm.CanSubmit, CanApprove: perm.CanApprove, CanReject: perm.CanReject,
            CanPublish: perm.CanPublish, CanLock: perm.CanLock, CanExport: perm.CanExport
          });
      },

      toggleAi() {
        google.script.run
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_setAiEnabled(this.authToken, this.aiEnabled);
      },

      saveAiConfig() {
        this.savingAiConfig = true;
        google.script.run
          .withSuccessHandler(() => {
            this.savingAiConfig = false;
            this.aiForm.apiKey = '';
            this.loadAdminData();
          })
          .withFailureHandler((e) => {
            this.savingAiConfig = false;
            this.errorMessage = e.message;
          })
          .api_updateAIProviderConfig(this.authToken, this.aiForm.providerId, this.aiForm.modelName, this.aiForm.apiKey, this.aiForm.temperature, this.aiForm.maxTokens, this.aiForm.timeout);
      },

      syncSchemaAction() {
        this.syncingSchema = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.syncingSchema = false;
            this.schemaSyncResult = result;
          })
          .withFailureHandler((e) => {
            this.syncingSchema = false;
            this.errorMessage = e.message;
          })
          .api_syncSchemaWithSpreadsheet(this.authToken);
      },

      auditFilters: { userId: '', action: '', fromDate: '', toDate: '' },
      auditFiltersActive() {
        const f = this.auditFilters;
        return f.userId || f.action || f.fromDate || f.toDate;
      },
      clearAuditFilters() {
        this.auditFilters = { userId: '', action: '', fromDate: '', toDate: '' };
        this.loadAuditLog();
      },
      // Input type=date chỉ có ngày (YYYY-MM-DD) — Timestamp lưu ISO đầy đủ có giờ (nowIso()), nên
      // phải ghép giờ đầu/cuối ngày mới bao trọn được cả ngày khi so sánh chuỗi >=/<= ở backend.
      buildAuditApiFilters_() {
        const f = this.auditFilters;
        return {
          userId: f.userId || '',
          action: f.action || '',
          fromDate: f.fromDate ? f.fromDate + 'T00:00:00.000Z' : '',
          toDate: f.toDate ? f.toDate + 'T23:59:59.999Z' : ''
        };
      },

      loadAuditLog() {
        google.script.run
          .withSuccessHandler((logs) => { this.auditLogs = logs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_searchAuditLog(this.authToken, this.buildAuditApiFilters_());
      },

      exportAuditLogAction() {
        this.exportingAuditLog = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.exportingAuditLog = false;
            this.auditExportResult = result;
          })
          .withFailureHandler((e) => {
            this.exportingAuditLog = false;
            this.errorMessage = e.message;
          })
          .api_exportAuditLogToExcel(this.authToken, this.buildAuditApiFilters_());
      }
    };
  }
</script>
