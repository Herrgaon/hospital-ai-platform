<!-- Alpine.js qua CDN — xem docs/06-ui-specification.md mục 2. Ghim phiên bản cụ thể (không dùng
     range @3.x.x thả nổi) + SRI theo docs/13-security.md mục 7 — hash tính từ chính file đã tải về
     và đối chiếu khớp với hash công bố trên jsdelivr trước khi ghim. Nâng phiên bản: đổi cả version
     trong URL lẫn hash integrity cùng lúc. -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
        integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
        crossorigin="anonymous"></script>
<script>
  function appShell() {
    return {
      currentView: 'dashboard',
      userEmail: '',
      isAdmin: false,
      currentUser: {},
      showProfileMenu: false,
      profileForm: { fullName: '' },
      savingProfile: false,
      pendingAvatarFile: null,
      uploadingAvatar: false,

      docTab: 'create',
      myDocuments: [],
      templates: [],
      selectedTemplateId: '',
      selectedTemplateFields: [],
      fieldValues: {},
      creating: false,
      currentDocument: null,
      checking: false,
      ruleCheckResult: null,
      exporting: false,
      exportResult: null,
      submittingApproval: false,
      submittedForApproval: false,
      reviewLibraryIds: [],
      reviewing: false,
      reviewResult: null,
      errorMessage: '',

      globalSearchKeyword: '',
      dashboard: { pendingApprovals: [], myRecentDocuments: [] },
      pendingApprovals: [],
      approvalComments: {},

      chatLibraryIds: [],
      chatMessages: [],
      chatInput: '',
      chatAsking: false,

      knowledgeTab: 'search',
      libraries: [],
      selectedLibraryId: '',
      canManageSelectedLibrary: false,
      libraryPermissions: [],
      userDirectory: [],
      newPermissionUserId: '',
      newLibraryName: '',
      newLibraryRequiresReview: true,
      creatingLibrary: false,
      showAdvancedMetadata: false,
      categories: [],
      newCategoryName: '',
      pendingFiles: [],
      readingFiles: false,
      stagingResult: null,
      stagingBatch: [],
      bulkApplyLibraryId: '',
      bulkSaveResults: [],
      maxBulkUploadCount: 15,
      uploadForm: {},
      classifying: false,
      savingClassification: false,
      pendingKnowledgeReviews: [],
      reviewComments: {},
      searchKeyword: '',
      searchResults: [],
      documentVersions: [],
      compareVersionA: '',
      compareVersionB: '',
      compareResult: null,
      comparing: false,

      adminTab: 'users',
      newUserForm: { email: '', fullName: '', department: '', role: 'Guest' },
      creatingUser: false,
      syncingSchema: false,
      schemaSyncResult: null,
      allUsers: [],
      allRoles: [],
      aiEnabled: false,
      activeAiConfig: null,
      aiProviders: [],
      aiForm: { providerId: '', modelName: '', apiKey: '', temperature: 0.3, maxTokens: 1024, timeout: 30 },
      savingAiConfig: false,
      auditLogs: [],
      exportingAuditLog: false,
      auditExportResult: null,
      accuracyReport: null,
      loadingAccuracyReport: false,
      archivedDocuments: [],

      ocrResults: {},
      templateForm: { name: '', libraryId: '', fieldsCsv: '' },
      pendingTemplateFile: null,
      creatingTemplate: false,

      init() {
        this.currentView = (location.hash || '#dashboard').replace('#', '');
        if (!document.documentElement.classList.contains('theme-loaded')) {
          document.documentElement.classList.add('theme-loaded');
          if (localStorage.getItem('theme') === 'dark' ||
              (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        }

        google.script.run
          .withSuccessHandler((user) => {
            this.userEmail = user.Email;
            this.isAdmin = user.Role === 'Admin';
            this.currentUser = user;
            this.profileForm.fullName = user.FullName;
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getCurrentUser();

        google.script.run
          .withSuccessHandler((templates) => { this.templates = templates; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listTemplates(null);
      },

      active(view) {
        return this.currentView === view ? 'bg-gray-200 dark:bg-gray-700 font-medium' : '';
      },

      // Điều hướng thuần JS — KHÔNG dùng <a href="#..."> điều hướng gốc, vì <base target="_top">
      // (cần thiết cho các link tải file mở tab mới) khiến trình duyệt cố điều hướng frame trên
      // cùng ra khỏi sandbox iframe của Apps Script, gây văng ra trang trắng userCodeAppPanel.
      go(view) {
        this.currentView = view;
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', '#' + view);
        }
      },

      toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      },

      // --- Avatar (dùng chung: bảng người dùng, danh bạ, top bar) ---
      initials(user) {
        const label = (user && (user.FullName || user.Email)) || '?';
        const parts = label.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return label.substring(0, 2).toUpperCase();
      },

      avatarColorStyle(user) {
        const key = (user && (user.UserID || user.Email)) || '?';
        const palette = ['#0891b2', '#0e7490', '#7c3aed', '#be185d', '#b45309', '#15803d', '#1d4ed8'];
        let hash = 0;
        for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
        const color = palette[hash % palette.length];
        return 'background-color:' + color + '; color:#ffffff;';
      },

      saveProfileAction() {
        this.savingProfile = true;
        google.script.run
          .withSuccessHandler(() => {
            this.savingProfile = false;
            this.currentUser.FullName = this.profileForm.fullName;
          })
          .withFailureHandler((e) => {
            this.savingProfile = false;
            this.errorMessage = e.message;
          })
          .api_updateMyProfile(this.profileForm.fullName);
      },

      onAvatarFileSelected(event) {
        const file = event.target.files[0];
        if (!file) { this.pendingAvatarFile = null; return; }
        const reader = new FileReader();
        reader.onload = () => {
          this.pendingAvatarFile = { mimeType: file.type || 'image/png', base64: reader.result.split(',')[1] };
          this.uploadAvatarAction();
        };
        reader.readAsDataURL(file);
      },

      uploadAvatarAction() {
        if (!this.pendingAvatarFile) return;
        this.uploadingAvatar = true;
        google.script.run
          .withSuccessHandler((updated) => {
            this.uploadingAvatar = false;
            this.pendingAvatarFile = null;
            this.currentUser.AvatarUrl = updated.AvatarUrl;
          })
          .withFailureHandler((e) => {
            this.uploadingAvatar = false;
            this.errorMessage = e.message;
          })
          .api_updateMyAvatar(this.pendingAvatarFile.base64, this.pendingAvatarFile.mimeType);
      },

      loadMyDocuments() {
        google.script.run
          .withSuccessHandler((docs) => { this.myDocuments = docs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listMyDocuments();
      },

      deleteDocumentAction(doc) {
        if (!confirm('Xoá văn bản "' + doc.Title + '"? File sẽ được chuyển vào Thùng rác, có thể khôi phục trong 30 ngày.')) return;
        google.script.run
          .withSuccessHandler(() => {
            this.myDocuments = this.myDocuments.filter(d => d.DocumentID !== doc.DocumentID);
            this.searchResults = this.searchResults.filter(d => d.DocumentID !== doc.DocumentID);
            this.pendingKnowledgeReviews = this.pendingKnowledgeReviews.filter(d => d.DocumentID !== doc.DocumentID);
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_deleteDocument(doc.DocumentID);
      },

      resumeDocument(doc) {
        this.currentDocument = doc;
        this.ruleCheckResult = null;
        this.exportResult = null;
        this.submittedForApproval = doc.Status === 'PENDING_APPROVAL' || doc.Status === 'PUBLISHED';
        this.reviewLibraryIds = [];
        this.reviewResult = null;
        this.docTab = 'create';
      },

      closeCurrentDocument() {
        this.currentDocument = null;
        this.ruleCheckResult = null;
        this.exportResult = null;
        this.submittedForApproval = false;
        this.reviewLibraryIds = [];
        this.reviewResult = null;
      },

      toggleReviewLibrary(libraryId, checked) {
        if (checked) {
          if (!this.reviewLibraryIds.includes(libraryId)) this.reviewLibraryIds.push(libraryId);
        } else {
          this.reviewLibraryIds = this.reviewLibraryIds.filter((id) => id !== libraryId);
        }
      },

      suggestReviewLibraries() {
        google.script.run
          .withSuccessHandler((libs) => { this.reviewLibraryIds = libs.map((l) => l.LibraryID); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_suggestLibrariesForDocument(this.currentDocument.DocumentID);
      },

      runLegalReview() {
        this.reviewing = true;
        this.reviewResult = null;
        google.script.run
          .withSuccessHandler((result) => {
            this.reviewing = false;
            this.reviewResult = result.success
              ? result.review
              : (result.error === 'AI_NOT_CONFIGURED'
                ? 'AI chưa được Admin bật/cấu hình.'
                : 'Lỗi: ' + result.error);
          })
          .withFailureHandler((e) => {
            this.reviewing = false;
            this.errorMessage = e.message;
          })
          .api_reviewDocumentAgainstLibraries(this.currentDocument.DocumentID, this.reviewLibraryIds);
      },

      onTemplateChange() {
        this.currentDocument = null;
        this.ruleCheckResult = null;
        this.exportResult = null;
        this.submittedForApproval = false;
        this.reviewLibraryIds = [];
        this.reviewResult = null;
        this.fieldValues = {};
        const template = this.templates.find((t) => t.TemplateID === this.selectedTemplateId);
        this.selectedTemplateFields = template ? JSON.parse(template.Fields || '[]') : [];
        this.selectedTemplateFields.forEach((f) => { this.fieldValues[f.name] = ''; });
      },

      createDocument() {
        this.creating = true;
        this.errorMessage = '';
        google.script.run
          .withSuccessHandler((doc) => {
            this.creating = false;
            this.currentDocument = doc;
            this.loadMyDocuments();
          })
          .withFailureHandler((e) => {
            this.creating = false;
            this.errorMessage = e.message;
          })
          .api_createDocumentFromTemplate(this.selectedTemplateId, this.fieldValues);
      },

      checkRules() {
        this.checking = true;
        this.errorMessage = '';
        google.script.run
          .withSuccessHandler((result) => {
            this.checking = false;
            this.ruleCheckResult = result;
          })
          .withFailureHandler((e) => {
            this.checking = false;
            this.errorMessage = e.message;
          })
          .api_checkDocumentRules(this.currentDocument.DocumentID);
      },

      exportWord() {
        this.exporting = true;
        this.errorMessage = '';
        google.script.run
          .withSuccessHandler((result) => {
            this.exporting = false;
            this.exportResult = result;
          })
          .withFailureHandler((e) => {
            this.exporting = false;
            this.errorMessage = e.message;
          })
          .api_exportDocumentAsWord(this.currentDocument.DocumentID);
      },

      submitForApprovalAction() {
        this.submittingApproval = true;
        google.script.run
          .withSuccessHandler(() => {
            this.submittingApproval = false;
            this.submittedForApproval = true;
            this.loadMyDocuments();
          })
          .withFailureHandler((e) => {
            this.submittingApproval = false;
            this.errorMessage = e.message;
          })
          .api_submitForApproval(this.currentDocument.DocumentID);
      },

      runGlobalSearch() {
        this.go('knowledge');
        this.knowledgeTab = 'search';
        this.searchKeyword = this.globalSearchKeyword;
        this.runSearch();
      },

      // --- Dashboard ---
      loadDashboard() {
        google.script.run
          .withSuccessHandler((summary) => { this.dashboard = summary; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getDashboardSummary();
      },

      // --- Workflow Inbox ---
      loadPendingApprovals() {
        google.script.run
          .withSuccessHandler((rows) => { this.pendingApprovals = rows; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listPendingApprovals();
      },

      approveInstance(instanceId) {
        google.script.run
          .withSuccessHandler(() => { this.loadPendingApprovals(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_approveWorkflowInstance(instanceId, this.approvalComments[instanceId] || '');
      },

      rejectInstance(instanceId) {
        if (!this.approvalComments[instanceId]) {
          this.errorMessage = 'Cần nhập ý kiến khi từ chối.';
          return;
        }
        google.script.run
          .withSuccessHandler(() => { this.loadPendingApprovals(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_rejectWorkflowInstance(instanceId, this.approvalComments[instanceId]);
      },

      // --- AI Chat ---
      sendChatMessage() {
        const question = this.chatInput;
        this.chatMessages.push({ role: 'user', text: question });
        this.chatInput = '';
        this.chatAsking = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.chatAsking = false;
            if (result.success) {
              this.chatMessages.push({ role: 'assistant', text: result.answer, sources: result.sources });
            } else {
              const reason = result.error === 'AI_NOT_CONFIGURED'
                ? 'AI chưa được Admin bật/cấu hình. Vào mục Admin để cấu hình AI Provider.'
                : ('Lỗi: ' + result.error);
              this.chatMessages.push({ role: 'assistant', text: reason });
            }
          })
          .withFailureHandler((e) => {
            this.chatAsking = false;
            this.errorMessage = e.message;
          })
          .api_askKnowledgeBase(question, this.chatLibraryIds);
      },

      toggleChatLibrary(libraryId, checked) {
        if (checked) {
          if (!this.chatLibraryIds.includes(libraryId)) this.chatLibraryIds.push(libraryId);
        } else {
          this.chatLibraryIds = this.chatLibraryIds.filter((id) => id !== libraryId);
        }
      },

      suggestChatLibraries() {
        if (!this.chatInput) return;
        google.script.run
          .withSuccessHandler((libs) => { this.chatLibraryIds = libs.map((l) => l.LibraryID); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_suggestLibrariesForQuestion(this.chatInput);
      },

      // --- Kho tri thức ---
      loadLibraries() {
        google.script.run
          .withSuccessHandler((libs) => { this.libraries = libs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listLibraries();
      },

      selectLibrary(libraryId) {
        this.selectedLibraryId = libraryId;
        this.searchResults = [];
        this.documentVersions = [];
        this.compareResult = null;
        this.canManageSelectedLibrary = false;
        this.libraryPermissions = [];

        google.script.run
          .withSuccessHandler((cats) => { this.categories = cats; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listCategories(libraryId);

        google.script.run
          .withSuccessHandler((canManage) => {
            this.canManageSelectedLibrary = canManage;
            if (canManage) this.loadLibraryPermissions();
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_canManageLibrary(libraryId);

        if (this.userDirectory.length === 0) {
          google.script.run
            .withSuccessHandler((dir) => { this.userDirectory = dir; })
            .withFailureHandler((e) => { this.errorMessage = e.message; })
            .api_listUserDirectory();
        }
      },

      loadLibraryPermissions() {
        google.script.run
          .withSuccessHandler((perms) => { this.libraryPermissions = perms; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listPermissionsForLibrary(this.selectedLibraryId);
      },

      userEmailById(userId) {
        const u = this.userDirectory.find((x) => x.UserID === userId);
        return u ? u.Email : userId;
      },

      libraryNameById(libraryId) {
        const lib = this.libraries.find((x) => x.LibraryID === libraryId);
        return lib ? lib.LibraryName : libraryId;
      },

      addPermissionRow() {
        if (this.libraryPermissions.some((p) => p.UserID === this.newPermissionUserId)) {
          this.newPermissionUserId = '';
          return;
        }
        this.libraryPermissions.push({
          PermissionID: 'NEW_' + this.newPermissionUserId,
          UserID: this.newPermissionUserId,
          LibraryID: this.selectedLibraryId,
          CanView: true, CanCreate: false, CanEdit: false, CanDelete: false, CanApprove: false
        });
        this.newPermissionUserId = '';
      },

      savePermissionRow(perm) {
        google.script.run
          .withSuccessHandler(() => { this.loadLibraryPermissions(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_setUserPermissionOverride(perm.UserID, this.selectedLibraryId, {
            CanView: perm.CanView, CanCreate: perm.CanCreate, CanEdit: perm.CanEdit,
            CanDelete: perm.CanDelete, CanApprove: perm.CanApprove
          });
      },

      createLibraryAction() {
        this.creatingLibrary = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingLibrary = false;
            this.newLibraryName = '';
            this.loadLibraries();
          })
          .withFailureHandler((e) => {
            this.creatingLibrary = false;
            this.errorMessage = e.message;
          })
          .api_createLibrary(this.newLibraryName, '', '', this.newLibraryRequiresReview);
      },

      createCategoryAction() {
        google.script.run
          .withSuccessHandler(() => {
            this.newCategoryName = '';
            this.selectLibrary(this.selectedLibraryId);
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_createCategory(this.selectedLibraryId, this.newCategoryName, '');
      },

      onFileSelected(event) {
        const files = Array.from(event.target.files || []);
        this.pendingFiles = [];
        this.readingFiles = files.length > 0;
        if (files.length === 0) return;

        // Đọc tất cả file trước rồi mới gán 1 lần (Promise.all) — tránh FileReader không đồng bộ
        // khiến người dùng bấm "Phân loại" khi mới đọc xong một phần, gửi thiếu file lên server.
        Promise.all(files.map((file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve({
            fileName: file.name,
            mimeType: file.type || 'application/octet-stream',
            base64: reader.result.split(',')[1]
          });
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        }))).then((results) => {
          this.pendingFiles = results;
          this.readingFiles = false;
        }).catch((err) => {
          this.errorMessage = 'Không đọc được file: ' + err;
          this.readingFiles = false;
        });
      },

      get pendingFile() {
        return this.pendingFiles[0] || null;
      },

      loadMaxBulkUploadCount() {
        google.script.run
          .withSuccessHandler((count) => { this.maxBulkUploadCount = count; })
          .withFailureHandler(() => {})
          .api_getMaxBulkUploadCount();
      },

      // --- Tải lên có phân loại tự động (Rule Engine + AI + xác nhận người dùng) ---
      // 1 file: dùng luồng đơn (stagingResult). Nhiều file: dùng luồng hàng loạt (stagingBatch)
      // — xem docs/10-knowledge-design.md mục 13 (Bulk Document Import Policy).
      runClassification() {
        this.classifying = true;
        if (this.pendingFiles.length <= 1) {
          google.script.run
            .withSuccessHandler((staging) => {
              this.classifying = false;
              this.stagingResult = staging;
              this.uploadForm = this.buildUploadFormFromStaging(staging);
            })
            .withFailureHandler((e) => {
              this.classifying = false;
              this.errorMessage = e.message;
            })
            .api_stageUploadForClassification(this.pendingFiles[0].fileName, this.pendingFiles[0].mimeType, this.pendingFiles[0].base64);
          return;
        }

        google.script.run
          .withSuccessHandler((results) => {
            this.classifying = false;
            this.stagingBatch = results.map((r) => {
              if (!r.success) return r;
              return Object.assign({}, r, { form: this.buildUploadFormFromStaging(r.staging), selected: true, skip: false });
            });
          })
          .withFailureHandler((e) => {
            this.classifying = false;
            this.errorMessage = e.message;
          })
          .api_stageBulkUpload(this.pendingFiles);
      },

      get bulkSummary() {
        const items = this.stagingBatch;
        return {
          total: items.length,
          failed: items.filter((i) => !i.success).length,
          duplicates: items.filter((i) => i.success && i.staging.duplicateOf && !i.skip).length,
          ready: items.filter((i) => i.success && (!i.staging.duplicateOf || i.skip)).length
        };
      },

      applyBulkLibrary() {
        if (!this.bulkApplyLibraryId) return;
        this.stagingBatch.forEach((item) => {
          if (item.success && item.selected) item.form.libraryId = this.bulkApplyLibraryId;
        });
      },

      saveAllSelected() {
        const queue = this.stagingBatch.filter((item) => item.success && item.selected && item.form.libraryId && (!item.staging.duplicateOf || item.skip));
        if (queue.length === 0) return;
        this.savingClassification = true;
        this.bulkSaveResults = [];
        this.saveNextInQueue_(queue, 0);
      },

      saveNextInQueue_(queue, index) {
        if (index >= queue.length) {
          this.savingClassification = false;
          this.stagingBatch = this.stagingBatch.filter((item) => !queue.includes(item) || this.bulkSaveResults.some((r) => r.fileName === item.fileName && !r.success));
          this.knowledgeTab = 'search';
          this.runSearch();
          return;
        }
        const item = queue[index];
        const csvToArray = (csv) => (csv || '').split(',').map((s) => s.trim()).filter((s) => s.length > 0);
        const f = item.form;
        const finalFields = {
          libraryId: f.libraryId, category: f.category, subCategory: f.subCategory,
          documentType: f.documentType, issuer: f.issuer, importance: f.importance, summary: f.summary,
          tags: csvToArray(f.tagsCsv), keywords: csvToArray(f.keywordsCsv), applicableDepartments: csvToArray(f.applicableDepartmentsCsv)
        };
        google.script.run
          .withSuccessHandler(() => {
            this.bulkSaveResults.push({ fileName: item.fileName, success: true });
            this.saveNextInQueue_(queue, index + 1);
          })
          .withFailureHandler((e) => {
            this.bulkSaveResults.push({ fileName: item.fileName, success: false, error: e.message });
            this.saveNextInQueue_(queue, index + 1);
          })
          .api_confirmClassificationAndSave(
            item.staging.fileId, item.staging.fileName, item.staging.parserCategory,
            item.staging.metadata, item.staging.ocrStatus, finalFields, item.staging.allFields
          );
      },

      cancelBulkUpload() {
        this.stagingBatch.forEach((item) => {
          if (item.success) {
            google.script.run.withFailureHandler((e) => { this.errorMessage = e.message; }).api_discardStagedUpload(item.staging.fileId);
          }
        });
        this.stagingBatch = [];
        this.pendingFiles = [];
      },

      buildUploadFormFromStaging(staging) {
        const merged = Object.assign({}, staging.accepted, staging.needsConfirmation);
        const valueOf = (field, fallback) => (merged[field] ? merged[field].value : fallback);
        const arrayOf = (field) => (merged[field] ? merged[field].value.join(', ') : '');
        const suggestedLibraryName = merged.library ? merged.library.value : '';
        const matchedLibrary = staging.availableLibraries.find((l) => l.LibraryName.toLowerCase() === (suggestedLibraryName || '').toLowerCase());
        return {
          libraryId: matchedLibrary ? matchedLibrary.LibraryID : '',
          category: valueOf('category', ''),
          subCategory: valueOf('subCategory', ''),
          documentType: valueOf('documentType', ''),
          issuer: valueOf('issuer', ''),
          importance: valueOf('importance', ''),
          summary: valueOf('summary', ''),
          tagsCsv: arrayOf('tags'),
          keywordsCsv: arrayOf('keywords'),
          applicableDepartmentsCsv: arrayOf('applicableDepartments'),
          _libraryConfidence: merged.library ? merged.library.confidence : undefined
        };
      },

      cancelStagedUpload() {
        if (this.stagingResult) {
          google.script.run
            .withFailureHandler((e) => { this.errorMessage = e.message; })
            .api_discardStagedUpload(this.stagingResult.fileId);
        }
        this.stagingResult = null;
        this.uploadForm = {};
        this.pendingFiles = [];
        this.showAdvancedMetadata = false;
      },

      saveClassifiedDocument() {
        this.savingClassification = true;
        const csvToArray = (csv) => (csv || '').split(',').map((s) => s.trim()).filter((s) => s.length > 0);
        const finalFields = {
          libraryId: this.uploadForm.libraryId,
          category: this.uploadForm.category,
          subCategory: this.uploadForm.subCategory,
          documentType: this.uploadForm.documentType,
          issuer: this.uploadForm.issuer,
          importance: this.uploadForm.importance,
          summary: this.uploadForm.summary,
          tags: csvToArray(this.uploadForm.tagsCsv),
          keywords: csvToArray(this.uploadForm.keywordsCsv),
          applicableDepartments: csvToArray(this.uploadForm.applicableDepartmentsCsv)
        };
        google.script.run
          .withSuccessHandler(() => {
            this.savingClassification = false;
            this.stagingResult = null;
            this.uploadForm = {};
            this.pendingFiles = [];
            this.showAdvancedMetadata = false;
            this.knowledgeTab = 'search';
            this.runSearch();
          })
          .withFailureHandler((e) => {
            this.savingClassification = false;
            this.errorMessage = e.message;
          })
          .api_confirmClassificationAndSave(
            this.stagingResult.fileId, this.stagingResult.fileName, this.stagingResult.parserCategory,
            this.stagingResult.metadata, this.stagingResult.ocrStatus, finalFields, this.stagingResult.allFields
          );
      },

      // --- Chờ duyệt tri thức ---
      loadPendingKnowledgeReviews() {
        google.script.run
          .withSuccessHandler((docs) => { this.pendingKnowledgeReviews = docs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listPendingKnowledgeReviews();
      },

      approveKnowledgeDocAction(documentId) {
        google.script.run
          .withSuccessHandler(() => { this.loadPendingKnowledgeReviews(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_approveKnowledgeDocument(documentId, this.reviewComments[documentId] || '');
      },

      rejectKnowledgeDocAction(documentId) {
        if (!this.reviewComments[documentId]) {
          this.errorMessage = 'Cần nhập ý kiến khi từ chối.';
          return;
        }
        google.script.run
          .withSuccessHandler(() => { this.loadPendingKnowledgeReviews(); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_rejectKnowledgeDocument(documentId, this.reviewComments[documentId]);
      },

      runSearch() {
        google.script.run
          .withSuccessHandler((results) => { this.searchResults = results; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_searchDocuments(this.searchKeyword || '', this.selectedLibraryId);
      },

      openVersions(documentId) {
        this.compareResult = null;
        google.script.run
          .withSuccessHandler((versions) => {
            this.documentVersions = versions;
            if (versions.length > 0) {
              this.compareVersionA = versions[0].VersionID;
              this.compareVersionB = versions[versions.length - 1].VersionID;
            }
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listDocumentVersions(documentId);
      },

      compareVersionsAction() {
        this.comparing = true;
        const documentId = this.documentVersions[0].DocumentID;
        google.script.run
          .withSuccessHandler((result) => {
            this.comparing = false;
            this.compareResult = result;
          })
          .withFailureHandler((e) => {
            this.comparing = false;
            this.errorMessage = e.message;
          })
          .api_compareDocumentVersions(documentId, this.compareVersionA, this.compareVersionB);
      },

      saveMaxBulkUploadCount() {
        google.script.run
          .withSuccessHandler((clamped) => { this.maxBulkUploadCount = clamped; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_setMaxBulkUploadCount(this.maxBulkUploadCount);
      },

      syncSchemaAction() {
        this.syncingSchema = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.syncingSchema = false;
            this.schemaSyncResult = result;
          })
          .withFailureHandler((e) => {
            this.syncingSchema = false;
            this.errorMessage = e.message;
          })
          .api_syncSchemaWithSpreadsheet();
      },

      // --- Quản trị ---
      loadAdminData() {
        if (this.libraries.length === 0) this.loadLibraries();
        google.script.run.withSuccessHandler((users) => { this.allUsers = users; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_listAllUsers();
        google.script.run.withSuccessHandler((roles) => { this.allRoles = roles; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_getAllRoles();
        google.script.run.withSuccessHandler((providers) => { this.aiProviders = providers; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_listAIProviders();
        google.script.run.withSuccessHandler((enabled) => { this.aiEnabled = enabled; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_isAiEnabled();
        google.script.run.withSuccessHandler((config) => { this.activeAiConfig = config; }).withFailureHandler((e) => { this.errorMessage = e.message; }).api_getActiveAIProviderConfig();
        this.loadMaxBulkUploadCount();
      },

      saveUserRole(u) {
        google.script.run
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_assignRole(u.UserID, u.Role);
        google.script.run
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_updateUserProfile(u.UserID, u.FullName, u.Department);
      },

      createUserAction() {
        this.creatingUser = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingUser = false;
            this.newUserForm = { email: '', fullName: '', department: '', role: 'Guest' };
            this.loadAdminData();
          })
          .withFailureHandler((e) => {
            this.creatingUser = false;
            this.errorMessage = e.message;
          })
          .api_createUser(this.newUserForm.email, this.newUserForm.fullName, this.newUserForm.role, this.newUserForm.department);
      },

      toggleAi() {
        google.script.run
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_setAiEnabled(this.aiEnabled);
      },

      saveAiConfig() {
        this.savingAiConfig = true;
        google.script.run
          .withSuccessHandler(() => {
            this.savingAiConfig = false;
            this.aiForm.apiKey = '';
            this.loadAdminData();
          })
          .withFailureHandler((e) => {
            this.savingAiConfig = false;
            this.errorMessage = e.message;
          })
          .api_updateAIProviderConfig(this.aiForm.providerId, this.aiForm.modelName, this.aiForm.apiKey, this.aiForm.temperature, this.aiForm.maxTokens, this.aiForm.timeout);
      },

      loadAuditLog() {
        google.script.run
          .withSuccessHandler((logs) => { this.auditLogs = logs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_searchAuditLog({});
      },

      exportAuditLogAction() {
        this.exportingAuditLog = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.exportingAuditLog = false;
            this.auditExportResult = result;
          })
          .withFailureHandler((e) => {
            this.exportingAuditLog = false;
            this.errorMessage = e.message;
          })
          .api_exportAuditLogToExcel({});
      },

      loadAccuracyReport() {
        this.loadingAccuracyReport = true;
        google.script.run
          .withSuccessHandler((report) => {
            this.loadingAccuracyReport = false;
            this.accuracyReport = report;
          })
          .withFailureHandler((e) => {
            this.loadingAccuracyReport = false;
            this.errorMessage = e.message;
          })
          .api_getClassificationAccuracyReport();
      },

      loadArchivedDocuments() {
        google.script.run
          .withSuccessHandler((docs) => { this.archivedDocuments = docs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listArchivedDocuments();
      },

      restoreDocumentAction(doc) {
        google.script.run
          .withSuccessHandler(() => {
            this.archivedDocuments = this.archivedDocuments.filter(d => d.DocumentID !== doc.DocumentID);
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_restoreDocument(doc.DocumentID);
      },

      // --- OCR ---
      extractTextAction(documentId) {
        google.script.run
          .withSuccessHandler((text) => { this.ocrResults[documentId] = text; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_extractTextFromDocument(documentId);
      },

      // --- Tạo mẫu văn bản (Admin) ---
      onTemplateFileSelected(event) {
        const file = event.target.files[0];
        if (!file) { this.pendingTemplateFile = null; return; }
        const reader = new FileReader();
        reader.onload = () => {
          this.pendingTemplateFile = {
            fileName: file.name,
            mimeType: file.type || 'application/octet-stream',
            base64: reader.result.split(',')[1]
          };
        };
        reader.readAsDataURL(file);
      },

      createTemplateAction() {
        this.creatingTemplate = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingTemplate = false;
            this.templateForm = { name: '', libraryId: '', fieldsCsv: '' };
            this.pendingTemplateFile = null;
            google.script.run.withSuccessHandler((templates) => { this.templates = templates; }).api_listTemplates(null);
          })
          .withFailureHandler((e) => {
            this.creatingTemplate = false;
            this.errorMessage = e.message;
          })
          .api_createTemplate(this.templateForm.name, this.templateForm.libraryId, '', this.pendingTemplateFile.fileName, this.pendingTemplateFile.mimeType, this.pendingTemplateFile.base64, this.templateForm.fieldsCsv);
      }
    };
  }
</script>
