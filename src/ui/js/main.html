<!-- Alpine.js qua CDN — xem docs/06-ui-specification.md mục 2. Ghim phiên bản cụ thể (không dùng
     range @3.x.x thả nổi) + SRI theo docs/13-security.md mục 7 — hash tính từ chính file đã tải về
     và đối chiếu khớp với hash công bố trên jsdelivr trước khi ghim. Nâng phiên bản: đổi cả version
     trong URL lẫn hash integrity cùng lúc. -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
        integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
        crossorigin="anonymous"></script>
<script>
  function appShell() {
    return {
      currentView: 'dashboard',
      userEmail: '',
      isAdmin: false,
      currentUser: {},
      myPermissionMap: {},
      can(libraryId, action) {
        return !!(this.myPermissionMap[libraryId] && this.myPermissionMap[libraryId][action]);
      },
      canAnywhere(action) {
        return Object.values(this.myPermissionMap).some((p) => p[action]);
      },
      showProfileMenu: false,
      profileForm: { fullName: '' },
      savingProfile: false,
      pendingAvatarFile: null,
      uploadingAvatar: false,

      docTab: 'create',
      myDocuments: [],
      myDocumentsStatusFilter: '',
      get myDocumentsFiltered() {
        return this.myDocumentsStatusFilter
          ? this.myDocuments.filter((d) => d.Status === this.myDocumentsStatusFilter)
          : this.myDocuments;
      },
      templates: [],
      get creatableTemplates() {
        return this.templates.filter((t) => this.can(t.LibraryID, 'CanCreate'));
      },
      selectedTemplateId: '',
      selectedTemplateFields: [],
      fieldValues: {},
      creating: false,
      currentDocument: null,
      checking: false,
      ruleCheckResult: null,
      formatMode: null,
      formatForm: { fontFamily: null, fontSize: null, bold: null, italic: null, underline: null, strikethrough: null,
        textColor: null, backgroundColor: null, textCase: null, alignment: null, lineSpacing: null,
        spacingBeforePt: null, spacingAfterPt: null, firstLineIndentMm: null, topMm: null, bottomMm: null, leftMm: null, rightMm: null },
      allowedFontFamilies: ['Times New Roman', 'Arial', 'Calibri', 'Cambria', 'Verdana'],
      applyingFormat: false,
      applyingNd30Style: false,
      aiFormatCommand: '',
      runningAiFormatCommand: false,
      aiFormatCommandResultText: '',
      stagedFile: null,
      stagingFile: false,
      formatInputMode: 'upload',
      pasteFormatTitle: '',
      pasteFormatText: '',
      downloadingFormattedFile: false,
      exporting: false,
      exportResult: null,
      submittingApproval: false,
      submittedForApproval: false,
      reviewLibraryIds: [],
      reviewing: false,
      reviewResult: null,
      errorMessage: '',

      globalSearchKeyword: '',
      dashboard: { pendingApprovals: [], myRecentDocuments: [] },
      pendingApprovals: [],
      approvalComments: {},

      chatLibraryIds: [],
      chatMessages: [],
      chatInput: '',
      chatAsking: false,

      knowledgeTab: 'search',
      libraries: [],
      selectedLibraryId: '',
      canManageSelectedLibrary: false,
      libraryPermissions: [],
      userDirectory: [],
      newPermissionUserId: '',
      newLibraryName: '',
      newLibraryManagerId: '',
      newLibraryRequiresReview: true,
      creatingLibrary: false,
      showAdvancedMetadata: false,
      categories: [],
      newCategoryName: '',
      pendingFiles: [],
      readingFiles: false,
      stagingResult: null,
      stagingBatch: [],
      bulkApplyLibraryId: '',
      bulkSaveResults: [],
      maxBulkUploadCount: 15,
      uploadForm: {},
      classifying: false,
      savingClassification: false,
      pendingKnowledgeReviews: [],
      reviewComments: {},
      searchKeyword: '',
      searchResults: [],
      documentVersions: [],
      compareVersionA: '',
      compareVersionB: '',
      compareResult: null,
      comparing: false,

      adminTab: 'users',
      newUserForm: { email: '', fullName: '', department: '', role: 'Guest' },
      creatingUser: false,
      syncingSchema: false,
      schemaSyncResult: null,
      allUsers: [],
      allRoles: [],
      aiEnabled: false,
      activeAiConfig: null,
      aiProviders: [],
      aiForm: { providerId: '', modelName: '', apiKey: '', temperature: 0.3, maxTokens: 1024, timeout: 30 },
      savingAiConfig: false,
      auditLogs: [],
      exportingAuditLog: false,
      auditExportResult: null,
      accuracyReport: null,
      loadingAccuracyReport: false,
      archivedDocuments: [],

      ocrResults: {},
      templateForm: { name: '', libraryId: '', fieldsCsv: '' },
      pendingTemplateFile: null,
      creatingTemplate: false,

      init() {
        // errorMessage được gán ở ~40 chỗ khắp app (withFailureHandler) nhưng trước đây chỉ 1-2 màn
        // hình thực sự hiển thị nó — theo dõi tập trung ở đây để MỌI lỗi tự động hiện thành toast,
        // không cần sửa lại từng chỗ gọi.
        this.$watch('errorMessage', (value) => { if (value) this.toast('error', value); });

        this.currentView = (location.hash || '#dashboard').replace('#', '');
        if (!document.documentElement.classList.contains('theme-loaded')) {
          document.documentElement.classList.add('theme-loaded');
          if (localStorage.getItem('theme') === 'dark' ||
              (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        }

        google.script.run
          .withSuccessHandler((user) => {
            this.userEmail = user.Email;
            this.isAdmin = user.Role === 'Admin';
            this.currentUser = user;
            this.profileForm.fullName = user.FullName;
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getCurrentUser();

        google.script.run
          .withSuccessHandler((templates) => { this.templates = templates; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listTemplates(null);

        // Bản đồ quyền trên từng kho — dùng để ẩn/hiện nút bấm đúng theo phân quyền thay vì hiện
        // hết rồi để lộ lỗi 403 khi bấm (xem docs/11-permission-design.md).
        google.script.run
          .withSuccessHandler((map) => { this.myPermissionMap = map; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_getMyPermissionMap();

        // Nạp trước cho badge chuông thông báo ở header — hiển thị được dù chưa vào đúng màn hình.
        this.loadPendingApprovals();
        this.loadPendingKnowledgeReviews();

        // Nạp trước để mọi màn hình đều biết AI đang bật/tắt (trước đây chỉ Admin mới biết, do
        // aiEnabled chỉ được nạp trong loadAdminData()) — các tính năng có AI (Quick Style vẫn chạy
        // không cần AI, chỉ riêng ô lệnh tự do cần AI) tự ẩn gợi ý "cần AI" khi đã tắt thay vì để
        // người dùng bấm rồi mới biết.
        google.script.run
          .withSuccessHandler((enabled) => { this.aiEnabled = enabled; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_isAiEnabled();
      },

      active(view) {
        return this.currentView === view ? 'active' : '';
      },

      // Điều hướng thuần JS — KHÔNG dùng <a href="#..."> điều hướng gốc, vì <base target="_top">
      // (cần thiết cho các link tải file mở tab mới) khiến trình duyệt cố điều hướng frame trên
      // cùng ra khỏi sandbox iframe của Apps Script, gây văng ra trang trắng userCodeAppPanel.
      go(view) {
        this.currentView = view;
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', '#' + view);
        }
      },

      toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      },

      // --- Toast & Modal (dùng chung toàn app) ---
      toasts: [],
      toastSeq: 0,
      toast(type, message) {
        const id = ++this.toastSeq;
        this.toasts.push({ id, type, message });
        setTimeout(() => { this.toasts = this.toasts.filter((t) => t.id !== id); }, 3500);
      },

      modalOpen: null,
      openModal(name) { this.modalOpen = name; },
      closeModal() { this.modalOpen = null; },

      get pendingCount() {
        return this.pendingApprovals.length + this.pendingKnowledgeReviews.length;
      },

      // --- Avatar (dùng chung: bảng người dùng, danh bạ, top bar) ---
      initials(user) {
        const label = (user && (user.FullName || user.Email)) || '?';
        const parts = label.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return label.substring(0, 2).toUpperCase();
      },

      avatarColorStyle(user) {
        const key = (user && (user.UserID || user.Email)) || '?';
        const palette = ['#0891b2', '#0e7490', '#7c3aed', '#be185d', '#b45309', '#15803d', '#1d4ed8'];
        let hash = 0;
        for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
        const color = palette[hash % palette.length];
        return 'background-color:' + color + '; color:#ffffff;';
      },

      saveProfileAction() {
        this.savingProfile = true;
        google.script.run
          .withSuccessHandler(() => {
            this.savingProfile = false;
            this.currentUser.FullName = this.profileForm.fullName;
          })
          .withFailureHandler((e) => {
            this.savingProfile = false;
            this.errorMessage = e.message;
          })
          .api_updateMyProfile(this.profileForm.fullName);
      },

      onAvatarFileSelected(event) {
        const file = event.target.files[0];
        if (!file) { this.pendingAvatarFile = null; return; }
        const reader = new FileReader();
        reader.onload = () => {
          this.pendingAvatarFile = { mimeType: file.type || 'image/png', base64: reader.result.split(',')[1] };
          this.uploadAvatarAction();
        };
        reader.readAsDataURL(file);
      },

      uploadAvatarAction() {
        if (!this.pendingAvatarFile) return;
        this.uploadingAvatar = true;
        google.script.run
          .withSuccessHandler((updated) => {
            this.uploadingAvatar = false;
            this.pendingAvatarFile = null;
            this.currentUser.AvatarUrl = updated.AvatarUrl;
          })
          .withFailureHandler((e) => {
            this.uploadingAvatar = false;
            this.errorMessage = e.message;
          })
          .api_updateMyAvatar(this.pendingAvatarFile.base64, this.pendingAvatarFile.mimeType);
      },

      loadMyDocuments() {
        google.script.run
          .withSuccessHandler((docs) => { this.myDocuments = docs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listMyDocuments();
      },

      deleteDocumentAction(doc) {
        if (!confirm('Xoá văn bản "' + doc.Title + '"? File sẽ được chuyển vào Thùng rác, có thể khôi phục trong 30 ngày.')) return;
        google.script.run
          .withSuccessHandler(() => {
            this.myDocuments = this.myDocuments.filter(d => d.DocumentID !== doc.DocumentID);
            this.searchResults = this.searchResults.filter(d => d.DocumentID !== doc.DocumentID);
            this.pendingKnowledgeReviews = this.pendingKnowledgeReviews.filter(d => d.DocumentID !== doc.DocumentID);
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_deleteDocument(doc.DocumentID);
      },

      resumeDocument(doc) {
        this.currentDocument = doc;
        this.ruleCheckResult = null;
        this.exportResult = null;
        this.submittedForApproval = doc.Status === 'PENDING_APPROVAL' || doc.Status === 'PUBLISHED';
        this.reviewLibraryIds = [];
        this.reviewResult = null;
        this.resetFormatForm();
        this.docTab = 'create';
      },

      closeCurrentDocument() {
        this.currentDocument = null;
        this.ruleCheckResult = null;
        this.exportResult = null;
        this.submittedForApproval = false;
        this.reviewLibraryIds = [];
        this.reviewResult = null;
        this.resetFormatForm();
      },

      toggleReviewLibrary(libraryId, checked) {
        if (checked) {
          if (!this.reviewLibraryIds.includes(libraryId)) this.reviewLibraryIds.push(libraryId);
        } else {
          this.reviewLibraryIds = this.reviewLibraryIds.filter((id) => id !== libraryId);
        }
      },

      suggestReviewLibraries() {
        google.script.run
          .withSuccessHandler((libs) => { this.reviewLibraryIds = libs.map((l) => l.LibraryID); })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_suggestLibrariesForDocument(this.currentDocument.DocumentID);
      },

      runLegalReview() {
        this.reviewing = true;
        this.reviewResult = null;
        google.script.run
          .withSuccessHandler((result) => {
            this.reviewing = false;
            this.reviewResult = result.success
              ? result.review
              : (result.error === 'AI_NOT_CONFIGURED'
                ? 'AI chưa được Admin bật/cấu hình.'
                : 'Lỗi: ' + result.error);
          })
          .withFailureHandler((e) => {
            this.reviewing = false;
            this.errorMessage = e.message;
          })
          .api_reviewDocumentAgainstLibraries(this.currentDocument.DocumentID, this.reviewLibraryIds);
      },

      openCreateDocumentModal() {
        this.selectedTemplateId = '';
        this.selectedTemplateFields = [];
        this.openModal('createDocument');
      },

      onTemplateChange() {
        this.currentDocument = null;
        this.ruleCheckResult = null;
        this.exportResult = null;
        this.submittedForApproval = false;
        this.reviewLibraryIds = [];
        this.reviewResult = null;
        this.fieldValues = {};
        const template = this.templates.find((t) => t.TemplateID === this.selectedTemplateId);
        this.selectedTemplateFields = template ? JSON.parse(template.Fields || '[]') : [];
        this.selectedTemplateFields.forEach((f) => { this.fieldValues[f.name] = ''; });
      },

      createDocument() {
        this.creating = true;
        this.errorMessage = '';
        google.script.run
          .withSuccessHandler((doc) => {
            this.creating = false;
            this.currentDocument = doc;
            this.closeModal();
            this.loadMyDocuments();
          })
          .withFailureHandler((e) => {
            this.creating = false;
            this.errorMessage = e.message;
          })
          .api_createDocumentFromTemplate(this.selectedTemplateId, this.fieldValues);
      },

      checkRules() {
        this.checking = true;
        this.errorMessage = '';
        google.script.run
          .withSuccessHandler((result) => {
            this.checking = false;
            this.ruleCheckResult = result;
          })
          .withFailureHandler((e) => {
            this.checking = false;
            this.errorMessage = e.message;
          })
          .api_checkDocumentRules(this.currentDocument.DocumentID);
      },

      get hasAnyFormatFieldSet() {
        return Object.values(this.formatForm).some((v) => v !== null && v !== '');
      },

      resetFormatForm() {
        this.formatMode = null;
        this.formatForm = { fontFamily: null, fontSize: null, bold: null, italic: null, underline: null,
          strikethrough: null, textColor: null, backgroundColor: null, textCase: null, alignment: null,
          lineSpacing: null, spacingBeforePt: null, spacingAfterPt: null, firstLineIndentMm: null,
          topMm: null, bottomMm: null, leftMm: null, rightMm: null };
        this.aiFormatCommand = '';
        this.aiFormatCommandResultText = '';
      },

      buildFormatOptionsFromForm_() {
        const f = this.formatForm;
        return {
          text: { fontFamily: f.fontFamily, fontSize: f.fontSize, bold: f.bold, italic: f.italic,
            underline: f.underline, strikethrough: f.strikethrough, textColor: f.textColor,
            backgroundColor: f.backgroundColor, textCase: f.textCase },
          paragraph: { alignment: f.alignment, lineSpacing: f.lineSpacing, spacingBeforePt: f.spacingBeforePt,
            spacingAfterPt: f.spacingAfterPt, firstLineIndentMm: f.firstLineIndentMm },
          margins: { topMm: f.topMm, bottomMm: f.bottomMm, leftMm: f.leftMm, rightMm: f.rightMm }
        };
      },

      applyManualFormattingAction() {
        this.applyingFormat = true;
        google.script.run
          .withSuccessHandler(() => {
            this.applyingFormat = false;
            this.toast('success', 'Đã áp dụng định dạng.');
          })
          .withFailureHandler((e) => {
            this.applyingFormat = false;
            this.errorMessage = e.message;
          })
          .api_applyDocumentFormatting(this.currentDocument.DocumentID, this.buildFormatOptionsFromForm_());
      },

      applyNd30QuickStyleAction() {
        this.applyingNd30Style = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.applyingNd30Style = false;
            if (result.success) {
              this.toast('success', 'Đã áp dụng thể thức Nghị định 30.');
            } else {
              this.errorMessage = result.error === 'ND30_RULE_SET_NOT_FOUND'
                ? 'Kho tài liệu này chưa gán bộ quy tắc Nghị định 30.'
                : 'Lỗi: ' + result.error;
            }
          })
          .withFailureHandler((e) => {
            this.applyingNd30Style = false;
            this.errorMessage = e.message;
          })
          .api_applyND30QuickStyle(this.currentDocument.DocumentID);
      },

      aiFormatErrorReason_(error) {
        const map = {
          AI_NOT_CONFIGURED: 'AI chưa được Admin bật/cấu hình.',
          AI_RESPONSE_NOT_JSON: 'AI trả về không đúng định dạng, thử diễn đạt lại yêu cầu.',
          AI_ACTION_NOT_RECOGNIZED: 'Không nhận diện được yêu cầu định dạng — thử diễn đạt lại (ví dụ: "In hoa toàn bộ văn bản", "Căn giữa", "Định dạng theo Nghị định 30").',
          AI_ACTION_INVALID: 'Yêu cầu bị từ chối vì tham số không hợp lệ.'
        };
        return map[error] || ('Lỗi: ' + error);
      },

      runAiFormatCommand() {
        if (!this.aiFormatCommand.trim()) return;
        this.runningAiFormatCommand = true;
        this.aiFormatCommandResultText = '';
        google.script.run
          .withSuccessHandler((result) => {
            this.runningAiFormatCommand = false;
            if (result.success) {
              this.aiFormatCommandResultText = 'Đã thực hiện: ' + result.action;
              this.toast('success', 'Đã áp dụng định dạng theo yêu cầu AI.');
            } else {
              this.aiFormatCommandResultText = this.aiFormatErrorReason_(result.error);
            }
          })
          .withFailureHandler((e) => {
            this.runningAiFormatCommand = false;
            this.errorMessage = e.message;
          })
          .api_applyAiFormattingCommand(this.currentDocument.DocumentID, this.aiFormatCommand);
      },

      // --- Trang "Chỉnh sửa định dạng" (độc lập, không qua tạo văn bản theo mẫu) ---
      // Dùng chung formatForm/aiFormatCommand/allowedFontFamilies/hasAnyFormatFieldSet/
      // resetFormatForm/buildFormatOptionsFromForm_/aiFormatErrorReason_ với thẻ "Định dạng văn bản"
      // ở DocumentEditor.html — chỉ khác API gọi (theo driveFileId thay vì documentId).
      onFormatFileSelected(event) {
        const file = event.target.files[0];
        event.target.value = '';
        if (!file) return;
        this.stagingFile = true;
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(',')[1];
          google.script.run
            .withSuccessHandler((result) => {
              this.stagingFile = false;
              this.stagedFile = result;
              this.resetFormatForm();
            })
            .withFailureHandler((e) => {
              this.stagingFile = false;
              this.errorMessage = e.message;
            })
            .api_stageDocumentForFormatting(file.name, file.type || 'application/octet-stream', base64);
        };
        reader.readAsDataURL(file);
      },

      stagePastedFormatTextAction() {
        if (!this.pasteFormatText.trim()) return;
        this.stagingFile = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.stagingFile = false;
            this.stagedFile = result;
            this.pasteFormatText = '';
            this.pasteFormatTitle = '';
            this.resetFormatForm();
          })
          .withFailureHandler((e) => {
            this.stagingFile = false;
            this.errorMessage = e.message;
          })
          .api_stagePastedTextForFormatting(this.pasteFormatText, this.pasteFormatTitle);
      },

      discardFormatFileAction() {
        if (!this.stagedFile) return;
        const driveFileId = this.stagedFile.driveFileId;
        this.stagedFile = null;
        this.formatInputMode = 'upload';
        this.resetFormatForm();
        google.script.run
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_discardStagedFormattingFile(driveFileId);
      },

      downloadFormattedFileAction(format) {
        this.downloadingFormattedFile = format;
        const apiCall = format === 'pdf' ? 'api_exportFormattingResultAsPdf' : 'api_exportFormattingResultAsWord';
        google.script.run
          .withSuccessHandler((result) => {
            this.downloadingFormattedFile = false;
            const byteChars = atob(result.base64);
            const bytes = new Uint8Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
            const blob = new Blob([bytes], { type: result.mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = result.fileName;
            link.click();
            URL.revokeObjectURL(url);
          })
          .withFailureHandler((e) => {
            this.downloadingFormattedFile = false;
            this.errorMessage = e.message;
          })
          [apiCall](this.stagedFile.driveFileId, this.stagedFile.fileName);
      },

      applyFormatFileManualAction() {
        this.applyingFormat = true;
        google.script.run
          .withSuccessHandler(() => {
            this.applyingFormat = false;
            this.toast('success', 'Đã áp dụng định dạng.');
          })
          .withFailureHandler((e) => {
            this.applyingFormat = false;
            this.errorMessage = e.message;
          })
          .api_applyManualFormattingToFile(this.stagedFile.driveFileId, this.buildFormatOptionsFromForm_());
      },

      applyFormatFileNd30Action() {
        this.applyingNd30Style = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.applyingNd30Style = false;
            if (result.success) {
              this.toast('success', 'Đã áp dụng thể thức Nghị định 30.');
            } else {
              this.errorMessage = result.error === 'ND30_RULE_SET_NOT_FOUND'
                ? 'Chưa có bộ quy tắc Nghị định 30 trong hệ thống.'
                : 'Lỗi: ' + result.error;
            }
          })
          .withFailureHandler((e) => {
            this.applyingNd30Style = false;
            this.errorMessage = e.message;
          })
          .api_applyND30QuickStyleToFile(this.stagedFile.driveFileId);
      },

      runFormatFileAiCommand() {
        if (!this.aiFormatCommand.trim()) return;
        this.runningAiFormatCommand = true;
        this.aiFormatCommandResultText = '';
        google.script.run
          .withSuccessHandler((result) => {
            this.runningAiFormatCommand = false;
            if (result.success) {
              this.aiFormatCommandResultText = 'Đã thực hiện: ' + result.action;
              this.toast('success', 'Đã áp dụng định dạng theo yêu cầu AI.');
            } else {
              this.aiFormatCommandResultText = this.aiFormatErrorReason_(result.error);
            }
          })

        };

      chatErrorReason_(error) {
        const map = {
          AI_NOT_CONFIGURED: 'AI chưa được Admin bật/cấu hình. Vào mục Admin để cấu hình AI Provider.',
          UNSUPPORTED_FILE_TYPE: 'Định dạng file này chưa hỗ trợ đọc nội dung (hỗ trợ: Google Docs, Word, PDF, ảnh, text).',
          OCR_FAILED: 'Không đọc được nội dung file (OCR thất bại) — thử file khác hoặc ảnh rõ nét hơn.',
          EMPTY_FILE: 'File không có nội dung văn bản để đọc.'
        };
        return map[error] || ('Lỗi: ' + error);

      sendChatMessage() {
        const question = this.chatInput;
        const attached = this.chatAttachedFile;
        this.chatMessages.push({ role: 'user', text: question, attachedFileName: attached ? attached.name : null });
        this.chatInput = '';
        this.chatAttachedFile = null;
        this.chatAsking = true;
        this.scrollChatToBottom();

        const handleResult = (result) => {
          this.chatAsking = false;
          if (result.success) {
            this.chatMessages.push({ role: 'assistant', text: result.answer, sources: result.sources });
          } else {
            this.chatMessages.push({ role: 'assistant', text: this.chatErrorReason_(result.error) });
          }
          this.scrollChatToBottom();
        };
        const handleFailure = (e) => {
          this.chatAsking = false;
          this.errorMessage = e.message;
        };

        if (attached) {
          google.script.run
            .withSuccessHandler(handleResult)
            .withFailureHandler(handleFailure)
            .api_askAboutAttachedFile(question, attached.name, attached.mimeType, attached.base64);
        } else {
          google.script.run
            .withSuccessHandler(handleResult)
            .withFailureHandler(handleFailure)
            .api_askKnowledgeBase(question, this.chatLibraryIds);
        }

      onFileSelected(event) {
        const files = Array.from(event.target.files || []);
        this.pendingFiles = [];
        this.readingFiles = files.length > 0;
        if (files.length === 0) return;

        // Đọc tất cả file trước rồi mới gán 1 lần (Promise.all) — tránh FileReader không đồng bộ
        // khiến người dùng bấm "Phân loại" khi mới đọc xong một phần, gửi thiếu file lên server.
        Promise.all(files.map((file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve({
            fileName: file.name,
            mimeType: file.type || 'application/octet-stream',
            base64: reader.result.split(',')[1]
          });
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        }))).then((results) => {
          this.pendingFiles = results;
          this.readingFiles = false;
        }).catch((err) => {
          this.errorMessage = 'Không đọc được file: ' + err;
          this.readingFiles = false;
        });
      },

      // --- Tải lên có phân loại tự động (Rule Engine + AI + xác nhận người dùng) ---
      // 1 file: dùng luồng đơn (stagingResult). Nhiều file: dùng luồng hàng loạt (stagingBatch)
      // — xem docs/10-knowledge-design.md mục 13 (Bulk Document Import Policy).
      runClassification() {
        this.classifying = true;
        if (this.pendingFiles.length <= 1) {
          google.script.run
            .withSuccessHandler((staging) => {
              this.classifying = false;
              this.stagingResult = staging;
              this.uploadForm = this.buildUploadFormFromStaging(staging);
            })
            .withFailureHandler((e) => {
              this.classifying = false;
              this.errorMessage = e.message;
            })
            .api_stageUploadForClassification(this.pendingFiles[0].fileName, this.pendingFiles[0].mimeType, this.pendingFiles[0].base64);
          return;
        }

        google.script.run
          .withSuccessHandler((results) => {
            this.classifying = false;
            this.stagingBatch = results.map((r) => {
              if (!r.success) return r;
              return Object.assign({}, r, { form: this.buildUploadFormFromStaging(r.staging), selected: true, skip: false });
            });
          })
          .withFailureHandler((e) => {
            this.classifying = false;
            this.errorMessage = e.message;
          })
          .api_stageBulkUpload(this.pendingFiles);
      },

      get bulkSummary() {
        const items = this.stagingBatch;
        return {
          total: items.length,
          failed: items.filter((i) => !i.success).length,
          duplicates: items.filter((i) => i.success && i.staging.duplicateOf && !i.skip).length,
          ready: items.filter((i) => i.success && (!i.staging.duplicateOf || i.skip)).length
        };
      },

      applyBulkLibrary() {
        if (!this.bulkApplyLibraryId) return;
        this.stagingBatch.forEach((item) => {
          if (item.success && item.selected) item.form.libraryId = this.bulkApplyLibraryId;
        });
      },

      saveAllSelected() {
        const queue = this.stagingBatch.filter((item) => item.success && item.selected && item.form.libraryId && (!item.staging.duplicateOf || item.skip));
        if (queue.length === 0) return;
        this.savingClassification = true;
        this.bulkSaveResults = [];
        this.saveNextInQueue_(queue, 0);
      },

      saveNextInQueue_(queue, index) {
        if (index >= queue.length) {
          this.savingClassification = false;
          this.stagingBatch = this.stagingBatch.filter((item) => !queue.includes(item) || this.bulkSaveResults.some((r) => r.fileName === item.fileName && !r.success));
          this.knowledgeTab = 'search';
          this.runSearch();
          return;
        }
        const item = queue[index];
        const csvToArray = (csv) => (csv || '').split(',').map((s) => s.trim()).filter((s) => s.length > 0);
        const f = item.form;
        const finalFields = {
          libraryId: f.libraryId, category: f.category, subCategory: f.subCategory,
          documentType: f.documentType, issuer: f.issuer, importance: f.importance, summary: f.summary,
          tags: csvToArray(f.tagsCsv), keywords: csvToArray(f.keywordsCsv), applicableDepartments: csvToArray(f.applicableDepartmentsCsv)
        };
        google.script.run
          .withSuccessHandler(() => {
            this.bulkSaveResults.push({ fileName: item.fileName, success: true });
            this.saveNextInQueue_(queue, index + 1);
          })
          .withFailureHandler((e) => {
            this.bulkSaveResults.push({ fileName: item.fileName, success: false, error: e.message });
            this.saveNextInQueue_(queue, index + 1);
          })
          .api_confirmClassificationAndSave(
            item.staging.fileId, item.staging.fileName, item.staging.parserCategory,
            item.staging.metadata, item.staging.ocrStatus, finalFields, item.staging.allFields
          );
      },

      cancelBulkUpload() {
        this.stagingBatch.forEach((item) => {
          if (item.success) {
            google.script.run.withFailureHandler((e) => { this.errorMessage = e.message; }).api_discardStagedUpload(item.staging.fileId);
          }
        });
        this.stagingBatch = [];
        this.pendingFiles = [];
      },

      buildUploadFormFromStaging(staging) {
        const merged = Object.assign({}, staging.accepted, staging.needsConfirmation);
        const valueOf = (field, fallback) => (merged[field] ? merged[field].value : fallback);
        const arrayOf = (field) => (merged[field] ? merged[field].value.join(', ') : '');
        const suggestedLibraryName = merged.library ? merged.library.value : '';
        const matchedLibrary = staging.availableLibraries.find((l) => l.LibraryName.toLowerCase() === (suggestedLibraryName || '').toLowerCase());
        return {
          libraryId: matchedLibrary ? matchedLibrary.LibraryID : '',
          category: valueOf('category', ''),
          subCategory: valueOf('subCategory', ''),
          documentType: valueOf('documentType', ''),
          issuer: valueOf('issuer', ''),
          importance: valueOf('importance', ''),
          summary: valueOf('summary', ''),
          tagsCsv: arrayOf('tags'),
          keywordsCsv: arrayOf('keywords'),
          applicableDepartmentsCsv: arrayOf('applicableDepartments'),
          _libraryConfidence: merged.library ? merged.library.confidence : undefined
        };
      },

      cancelStagedUpload() {
        if (this.stagingResult) {
          google.script.run
            .withFailureHandler((e) => { this.errorMessage = e.message; })
            .api_discardStagedUpload(this.stagingResult.fileId);
        }
        this.stagingResult = null;
        this.uploadForm = {};
        this.pendingFiles = [];
        this.showAdvancedMetadata = false;
      },

        const finalFields = {

      loadAuditLog() {
        google.script.run
          .withSuccessHandler((logs) => { this.auditLogs = logs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_searchAuditLog(this.buildAuditApiFilters_());
      },

      exportAuditLogAction() {
        this.exportingAuditLog = true;
        google.script.run
          .withSuccessHandler((result) => {
            this.exportingAuditLog = false;
            this.auditExportResult = result;
          })
          .withFailureHandler((e) => {
            this.exportingAuditLog = false;
            this.errorMessage = e.message;
          })
          .api_exportAuditLogToExcel(this.buildAuditApiFilters_());
      },

      loadAccuracyReport() {
        this.loadingAccuracyReport = true;
        google.script.run
          .withSuccessHandler((report) => {
            this.loadingAccuracyReport = false;
            this.accuracyReport = report;
          })
          .withFailureHandler((e) => {
            this.loadingAccuracyReport = false;
            this.errorMessage = e.message;
          })
          .api_getClassificationAccuracyReport();
      },

      loadArchivedDocuments() {
        google.script.run
          .withSuccessHandler((docs) => { this.archivedDocuments = docs; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_listArchivedDocuments();
      },

      restoreDocumentAction(doc) {
        google.script.run
          .withSuccessHandler(() => {
            this.archivedDocuments = this.archivedDocuments.filter(d => d.DocumentID !== doc.DocumentID);
          })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_restoreDocument(doc.DocumentID);
      },

      // --- OCR ---
      extractTextAction(documentId) {
        google.script.run
          .withSuccessHandler((text) => { this.ocrResults[documentId] = text; })
          .withFailureHandler((e) => { this.errorMessage = e.message; })
          .api_extractTextFromDocument(documentId);
      },

      // --- Tạo mẫu văn bản (Admin) ---
      onTemplateFileSelected(event) {
        const file = event.target.files[0];
        if (!file) { this.pendingTemplateFile = null; return; }
        const reader = new FileReader();
        reader.onload = () => {
          this.pendingTemplateFile = {
            fileName: file.name,
            mimeType: file.type || 'application/octet-stream',
            base64: reader.result.split(',')[1]
          };
        };
        reader.readAsDataURL(file);
      },

      createTemplateAction() {
        this.creatingTemplate = true;
        google.script.run
          .withSuccessHandler(() => {
            this.creatingTemplate = false;
            this.templateForm = { name: '', libraryId: '', fieldsCsv: '' };
            this.pendingTemplateFile = null;
            this.closeModal();
            this.toast('success', 'Đã tạo mẫu văn bản mới.');
            google.script.run.withSuccessHandler((templates) => { this.templates = templates; }).api_listTemplates(null);
          })
          .withFailureHandler((e) => {
            this.creatingTemplate = false;
            this.errorMessage = e.message;
          })
          .api_createTemplate(this.templateForm.name, this.templateForm.libraryId, '', this.pendingTemplateFile.fileName, this.pendingTemplateFile.mimeType, this.pendingTemplateFile.base64, this.templateForm.fieldsCsv);
      }
    };
  }
</script>
