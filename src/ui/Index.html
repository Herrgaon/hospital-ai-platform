<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <?!= include('ui/css/main') ?>
</head>
<body>
  <div x-data="appShell()" x-init="init()">

  <?!= include('ui/views/Login') ?>

  <div x-show="authToken && currentUser.UserID" x-cloak class="app-shell">

    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="app-sidebar-logo">
        <div class="app-sidebar-logo-icon">⬡</div>
        <div>
          <div class="app-sidebar-title font-display">BVĐK ĐÔNG SƠN</div>
          <div class="app-sidebar-sub">Quản lý công việc – Lịch trực</div>
        </div>
      </div>
      <nav class="app-sidebar-menu">
        <a href="#dashboard" @click.prevent="go('dashboard')" class="app-nav-item" :class="active('dashboard')"><span class="app-nav-icon">🏠</span> Trang chủ</a>
        <a href="#personnel" @click.prevent="go('personnel')" class="app-nav-item" :class="active('personnel')"><span class="app-nav-icon">👤</span> Nhân sự</a>

        <button type="button" @click="toggleNavGroup('work')" class="app-nav-group-label" :class="isNavGroupCollapsed('work') ? 'collapsed' : ''">
          <span>📋 Công việc &amp; Lịch trực</span><span class="app-nav-group-chevron">▾</span>
        </button>
        <div x-show="!isNavGroupCollapsed('work')">
          <a href="#tasks" @click.prevent="go('tasks')" class="app-nav-item" :class="active('tasks')"><span class="app-nav-icon">▤</span> Công việc</a>
          <a href="#clinical" @click.prevent="go('clinical')" class="app-nav-item" :class="active('clinical')"><span class="app-nav-icon">✚</span> Phân công chuyên môn</a>
          <a href="#duty" @click.prevent="go('duty')" class="app-nav-item" :class="active('duty')"><span class="app-nav-icon">▧</span> Lịch trực tuần</a>
          <a href="#swap" @click.prevent="go('swap')" class="app-nav-item" :class="active('swap')"><span class="app-nav-icon">⇄</span> Đổi trực</a>
        </div>

        <button type="button" @click="toggleNavGroup('attendance')" class="app-nav-group-label" :class="isNavGroupCollapsed('attendance') ? 'collapsed' : ''">
          <span>⏱ Chấm công &amp; Thu nhập</span><span class="app-nav-group-chevron">▾</span>
        </button>
        <div x-show="!isNavGroupCollapsed('attendance')">
          <a href="#attendance" @click.prevent="go('attendance')" class="app-nav-item" :class="active('attendance')"><span class="app-nav-icon">🕘</span> Chấm công</a>
          <a href="#overtime" @click.prevent="go('overtime')" class="app-nav-item" :class="active('overtime')"><span class="app-nav-icon">⏱</span> Làm thêm giờ</a>
          <a href="#overtimeList" @click.prevent="go('overtimeList')" class="app-nav-item" :class="active('overtimeList')"><span class="app-nav-icon">🌙</span> DS ngoài giờ theo ca</a>
          <a href="#payroll" @click.prevent="go('payroll')" class="app-nav-item" x-show="canAnywhere('CanExport')" :class="active('payroll')"><span class="app-nav-icon">📊</span> Tổng hợp thu nhập</a>
        </div>

        <button type="button" @click="toggleNavGroup('data')" class="app-nav-group-label" :class="isNavGroupCollapsed('data') ? 'collapsed' : ''">
          <span>📊 Số liệu &amp; Đánh giá</span><span class="app-nav-group-chevron">▾</span>
        </button>
        <div x-show="!isNavGroupCollapsed('data')">
          <a href="#clinicalStats" @click.prevent="go('clinicalStats')" class="app-nav-item" :class="active('clinicalStats')"><span class="app-nav-icon">📈</span> Số liệu chuyên môn</a>
          <a href="#insurance" @click.prevent="go('insurance')" class="app-nav-item" :class="active('insurance')"><span class="app-nav-icon">🏥</span> BHYT / Xuất toán</a>
          <a href="#incident" @click.prevent="go('incident')" class="app-nav-item" :class="active('incident')"><span class="app-nav-icon">⚠</span> Sự cố / An toàn</a>
          <a href="#kpi" @click.prevent="go('kpi')" class="app-nav-item" :class="active('kpi')"><span class="app-nav-icon">🎯</span> KPI</a>
        </div>

        <template x-if="isSuperAdmin">
          <div>
            <button type="button" @click="toggleNavGroup('admin')" class="app-nav-group-label" :class="isNavGroupCollapsed('admin') ? 'collapsed' : ''">
              <span>⚙ Quản trị</span><span class="app-nav-group-chevron">▾</span>
            </button>
            <div x-show="!isNavGroupCollapsed('admin')">
              <a href="#admin" @click.prevent="go('admin')" class="app-nav-item" :class="active('admin')"><span class="app-nav-icon">⚙</span> Quản trị hệ thống</a>
            </div>
          </div>
        </template>
      </nav>
      <div class="app-sidebar-footer">● STATUS: ONLINE</div>
    </aside>

    <!-- Main -->
    <div class="app-main">
      <header class="app-header">
        <div class="app-header-right relative">
          <button @click="toggleTheme()" class="btn btn-secondary btn-sm">☀/☾</button>

          <div class="app-header-bell" @click="go('swap')">
            🔔
            <span x-show="pendingCount > 0" class="app-header-bell-badge" x-text="pendingCount > 9 ? '9+' : pendingCount"></span>
          </div>

          <button @click="showProfileMenu = !showProfileMenu" class="app-header-user">
            <img x-show="currentUser.AvatarUrl" :src="currentUser.AvatarUrl" class="w-8 h-8 rounded-full object-cover holo-border-strong">
            <div x-show="!currentUser.AvatarUrl" class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-tech holo-border-strong" :style="avatarColorStyle(currentUser)" x-text="initials(currentUser)"></div>
            <div class="app-header-user-info hidden sm:block">
              <div class="app-header-user-name" x-text="currentUser.FullName || userEmail"></div>
              <div class="app-header-user-role" x-text="currentUser.Role || ''"></div>
            </div>
          </button>

          <div x-show="showProfileMenu" @click.outside="showProfileMenu = false" x-cloak class="modal absolute right-0 top-12 w-56 p-2 space-y-1 z-10">
            <div class="flex items-center gap-2 px-2 py-2" style="border-bottom: 1px solid var(--holo-border);">
              <img x-show="currentUser.AvatarUrl" :src="currentUser.AvatarUrl" class="w-9 h-9 rounded-full object-cover">
              <div x-show="!currentUser.AvatarUrl" class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-tech" :style="avatarColorStyle(currentUser)" x-text="initials(currentUser)"></div>
              <div class="min-w-0">
                <div class="text-sm font-medium truncate" x-text="currentUser.FullName || userEmail"></div>
                <div class="text-xs holo-text-dim truncate" x-text="userEmail"></div>
              </div>
            </div>
            <button @click="showProfileMenu = false; openMyProfile()" class="app-nav-item w-full text-left">👤 Thông tin cá nhân</button>
            <button @click="showProfileMenu = false; openChangePasswordModal()" class="app-nav-item w-full text-left">🔒 Đổi mật khẩu</button>
            <button @click="showProfileMenu = false; logoutAction()" class="app-nav-item w-full text-left">↪ Đăng xuất</button>
          </div>
        </div>
      </header>
      <main id="page-content">
        <template x-if="currentView === 'admin' && !isSuperAdmin">
          <p class="holo-text-dim">Bạn không có quyền truy cập màn hình này.</p>
        </template>
        <?!= include('ui/views/Dashboard') ?>
        <?!= include('ui/views/Personnel') ?>
        <?!= include('ui/views/Profile') ?>
        <?!= include('ui/views/Tasks') ?>
        <?!= include('ui/views/ClinicalAssignments') ?>
        <?!= include('ui/views/DutySchedule') ?>
        <?!= include('ui/views/DutySwap') ?>
        <?!= include('ui/views/Attendance') ?>
        <?!= include('ui/views/Overtime') ?>
        <?!= include('ui/views/OvertimeList') ?>
        <?!= include('ui/views/Payroll') ?>
        <?!= include('ui/views/ClinicalStats') ?>
        <?!= include('ui/views/InsuranceAudit') ?>
        <?!= include('ui/views/Incident') ?>
        <?!= include('ui/views/Kpi') ?>
        <?!= include('ui/views/Admin') ?>
      </main>
    </div>

    <!-- Modal: Đổi mật khẩu (dùng chung toàn app, mở từ menu hồ sơ) -->
    <div x-show="modalOpen === 'changePassword'" x-cloak class="modal-overlay" @click.self="closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h2>Đổi mật khẩu</h2>
          <button @click="closeModal()" class="modal-close">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="required">Mật khẩu hiện tại</label>
            <div class="relative">
              <input :type="showChangePasswordOld ? 'text' : 'password'" x-model="changePasswordForm.oldPassword" class="form-control pr-10">
              <button type="button" @click="showChangePasswordOld = !showChangePasswordOld" class="absolute right-2 top-1/2 -translate-y-1/2 text-sm opacity-60 hover:opacity-100" :title="showChangePasswordOld ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'" tabindex="-1">
                <span x-text="showChangePasswordOld ? '🙈' : '👁'"></span>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="required">Mật khẩu mới (tối thiểu 8 ký tự)</label>
            <div class="relative">
              <input :type="showChangePasswordNew ? 'text' : 'password'" x-model="changePasswordForm.newPassword" class="form-control pr-10">
              <button type="button" @click="showChangePasswordNew = !showChangePasswordNew" class="absolute right-2 top-1/2 -translate-y-1/2 text-sm opacity-60 hover:opacity-100" :title="showChangePasswordNew ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'" tabindex="-1">
                <span x-text="showChangePasswordNew ? '🙈' : '👁'"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button @click="closeModal()" class="btn btn-secondary">Huỷ</button>
          <button @click="changeMyPasswordAction()" :disabled="changingPassword || !changePasswordForm.oldPassword || changePasswordForm.newPassword.length < 8" class="btn btn-primary">
            <span x-text="changingPassword ? 'Đang lưu...' : 'Đổi mật khẩu'"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Toasts -->
    <div class="toast-stack">
      <template x-for="t in toasts" :key="t.id">
        <div class="toast" :class="'toast-' + t.type" x-text="t.message"></div>
      </template>
    </div>
  </div>
  </div>

  <?!= include('ui/js/main') ?>
</body>
</html>
