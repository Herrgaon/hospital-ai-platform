<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <?!= include('ui/css/main') ?>
</head>
<body>
  <div x-data="appShell()" x-init="init()" class="app-shell">

    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="app-sidebar-logo">
        <div class="app-sidebar-logo-icon">⬡</div>
        <div>
          <div class="app-sidebar-title font-display">AI OFFICE</div>
          <div class="app-sidebar-sub">Platform v1</div>
        </div>
      </div>
      <nav class="app-sidebar-menu">
        <a href="#dashboard" @click.prevent="go('dashboard')" class="app-nav-item" :class="active('dashboard')"><span class="app-nav-icon">▣</span> Dashboard</a>
        <a href="#documents" @click.prevent="go('documents')" class="app-nav-item" :class="active('documents')"><span class="app-nav-icon">▤</span> Văn bản</a>
        <a href="#knowledge" @click.prevent="go('knowledge')" class="app-nav-item" :class="active('knowledge')"><span class="app-nav-icon">▥</span> Tri thức</a>
        <a href="#aichat" @click.prevent="go('aichat')" class="app-nav-item" :class="active('aichat')"><span class="app-nav-icon">◈</span> AI Chat</a>
        <a href="#workflow" @click.prevent="go('workflow')" class="app-nav-item" :class="active('workflow')"><span class="app-nav-icon">▧</span> Workflow</a>
        <a href="#admin" @click.prevent="go('admin')" class="app-nav-item" x-show="isAdmin" :class="active('admin')"><span class="app-nav-icon">⚙</span> Admin</a>
      </nav>
      <div class="app-sidebar-footer">● STATUS: ONLINE</div>
    </aside>

    <!-- Main -->
    <div class="app-main">
      <header class="app-header">
        <div class="app-header-search">
          <span class="app-header-search-icon">🔍</span>
          <input type="search" x-model="globalSearchKeyword" @keyup.enter="runGlobalSearch()" placeholder="Tìm kiếm tài liệu...">
        </div>
        <div class="app-header-right relative">
          <button @click="toggleTheme()" class="btn btn-secondary btn-sm">☀/☾</button>

          <div class="app-header-bell" @click="go('workflow')">
            🔔
            <span x-show="pendingCount > 0" class="app-header-bell-badge" x-text="pendingCount > 9 ? '9+' : pendingCount"></span>
          </div>

          <button @click="showProfileMenu = !showProfileMenu" class="app-header-user">
            <img x-show="currentUser.AvatarUrl" :src="currentUser.AvatarUrl" class="w-8 h-8 rounded-full object-cover holo-border-strong">
            <div x-show="!currentUser.AvatarUrl" class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-tech holo-border-strong" :style="avatarColorStyle(currentUser)" x-text="initials(currentUser)"></div>
            <div class="app-header-user-info hidden sm:block">
              <div class="app-header-user-name" x-text="currentUser.FullName || userEmail"></div>
              <div class="app-header-user-role" x-text="currentUser.Role || ''"></div>
            </div>
          </button>

          <div x-show="showProfileMenu" @click.outside="showProfileMenu = false" x-cloak class="modal absolute right-0 top-12 w-72 p-4 space-y-3 z-10">
            <p class="holo-label">Hồ sơ của tôi</p>
            <div class="flex items-center gap-3">
              <img x-show="currentUser.AvatarUrl" :src="currentUser.AvatarUrl" class="w-12 h-12 rounded-full object-cover holo-border-strong">
              <div x-show="!currentUser.AvatarUrl" class="w-12 h-12 rounded-full flex items-center justify-center text-sm font-tech holo-border-strong" :style="avatarColorStyle(currentUser)" x-text="initials(currentUser)"></div>
              <div>
                <label class="btn btn-secondary btn-xs cursor-pointer inline-block">
                  <span x-text="uploadingAvatar ? 'Đang tải...' : 'Đổi ảnh đại diện'"></span>
                  <input type="file" accept="image/*" @change="onAvatarFileSelected($event)" class="hidden">
                </label>
              </div>
            </div>
            <div class="form-group !mb-2">
              <label>Tên hiển thị</label>
              <input type="text" x-model="profileForm.fullName" class="form-control">
            </div>
            <p class="text-xs holo-text-dim" x-text="userEmail"></p>
            <button @click="saveProfileAction()" :disabled="savingProfile" class="btn btn-primary btn-sm w-full">
              <span x-text="savingProfile ? 'Đang lưu...' : 'Lưu thay đổi'"></span>
            </button>
          </div>
        </div>
      </header>
      <main id="page-content">
        <template x-if="currentView === 'admin' && !isAdmin">
          <p class="holo-text-dim">Màn hình này sẽ được lập trình ở giai đoạn sau — xem docs/16-development-roadmap.md.</p>
        </template>
        <?!= include('ui/views/Dashboard') ?>
        <?!= include('ui/views/DocumentEditor') ?>
        <?!= include('ui/views/Knowledge') ?>
        <?!= include('ui/views/WorkflowInbox') ?>
        <?!= include('ui/views/AiChat') ?>
        <?!= include('ui/views/Admin') ?>
      </main>
    </div>

    <!-- Toasts -->
    <div class="toast-stack">
      <template x-for="t in toasts" :key="t.id">
        <div class="toast" :class="'toast-' + t.type" x-text="t.message"></div>
      </template>
    </div>
  </div>

  <?!= include('ui/js/main') ?>
</body>
</html>
